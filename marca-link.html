<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beme — Revisión de campaña</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.0/dist/umd/supabase.js"></script>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f7fa;--surface:#fff;--surface2:#f0f0f5;--surface3:#e4e4ec;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.15);
  --text:#111;--text-muted:#666;--text-dim:#aaa;
  --primary:#b2005d;--purple:#9414E0;
  --gradient:linear-gradient(135deg,#b2005d 0%,#9414E0 100%);
  --shadow:0 4px 16px rgba(0,0,0,0.08);
  --radius:12px;--radius-sm:8px;--radius-lg:16px;
  --green:#16a34a;--blue:#0ea5e9;--yellow:#d97706;--red:#dc2626;
}
body.dark{--bg:#0f0f0f;--surface:#181818;--surface2:#202020;--surface3:#2a2a2a;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);--text:#f0f0f0;--text-muted:#888;--text-dim:#555;--shadow:0 4px 24px rgba(0,0,0,0.4)}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:99px}
.topbar{position:sticky;top:0;z-index:100;background:rgba(247,247,250,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;gap:12px}
body.dark .topbar{background:rgba(15,15,15,0.92)}
.logo{display:flex;align-items:center;text-decoration:none}.logo img{height:44px;width:auto}
.logo .logo-dark{display:none}body.dark .logo .logo-light{display:none}body.dark .logo .logo-dark{display:block}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.role-tag{font-size:10px;padding:3px 8px;border-radius:20px;background:rgba(148,20,224,0.12);color:var(--purple);font-weight:700}
.icon-btn{width:32px;height:32px;border-radius:8px;border:none;background:var(--surface2);color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.main{max-width:920px;margin:0 auto;padding:28px 24px}
.camp-hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px 24px;margin-bottom:20px;display:flex;align-items:center;gap:16px;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.camp-hero .logo-box{width:54px;height:54px;border-radius:14px;background:var(--gradient);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex-shrink:0}
.camp-hero h1{font-family:'Syne',sans-serif;font-size:22px;font-weight:800}
.camp-hero .sub{font-size:13px;color:var(--text-muted);margin-top:2px}
.estado-badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;flex-shrink:0;margin-left:auto}
.estado-sin_iniciar{background:rgba(85,85,85,0.12);color:#888}
.estado-en_curso{background:rgba(14,165,233,0.12);color:#38bdf8}
.estado-etapa_finanzas{background:rgba(245,158,11,0.12);color:#fbbf24}
.estado-finalizada{background:rgba(34,197,94,0.12);color:#4ade80}
.estado-cancelada{background:rgba(239,68,68,0.12);color:#ef4444}
.brief-section{padding:14px 18px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:20px}
.brief-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-dim);margin-bottom:8px}
.brief-file{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;text-decoration:none;border:1px solid var(--border2);color:var(--blue);background:var(--surface2);margin:0 6px 6px 0}
.section-label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-dim);margin:0 2px 12px}
.tal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
.tal-head{display:flex;align-items:center;gap:12px;padding:16px 20px;cursor:pointer}
.tal-head:hover{background:var(--surface2)}
.t-avatar{width:42px;height:42px;border-radius:50%;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--text-muted);flex-shrink:0;overflow:hidden}
.t-avatar img{width:100%;height:100%;object-fit:cover}
.t-name{font-size:15px;font-weight:700}
.t-meta{font-size:12px;color:var(--text-muted)}
.fee-chip{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:6px 14px;text-align:right;flex-shrink:0}
.fee-chip .lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--text-dim)}
.fee-chip .val{font-size:14px;font-weight:800}
.cam-expand{transition:transform 0.2s;color:var(--text-dim);flex-shrink:0}
.tal-card.open .cam-expand{transform:rotate(180deg)}
.tal-body{display:none;padding:0 20px 18px;border-top:1px solid var(--border)}
.tal-card.open .tal-body{display:block}
.cont-card{border:1px solid var(--border);border-radius:var(--radius);margin-top:12px;overflow:hidden;background:var(--surface)}
.cont-head{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer}.cont-head:hover{background:var(--surface2)}
.tipo-badge{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;flex-shrink:0;background:var(--surface2);color:var(--text-muted)}
.cont-titulo{font-size:13px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.paso-chip{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);flex-shrink:0}
.paso-chip.review{background:rgba(245,158,11,0.12);border-color:rgba(245,158,11,0.25);color:var(--yellow)}
.paso-chip.done{background:rgba(22,163,74,0.08);border-color:rgba(22,163,74,0.2);color:var(--green)}
.cont-expand{transition:transform 0.2s;color:var(--text-dim);flex-shrink:0}
.cont-card.open .cont-expand{transform:rotate(180deg)}
.cont-body{display:none;padding:14px;border-top:1px solid var(--border)}.cont-card.open .cont-body{display:block}
.files-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.file-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:6px;font-size:11px;font-weight:700;text-decoration:none;border:1px solid var(--border2);background:var(--surface2);color:var(--blue)}
.review-box{background:rgba(245,158,11,0.06);border:1px solid rgba(245,158,11,0.22);border-radius:var(--radius-sm);padding:14px;margin-bottom:12px}
.review-title{font-size:12px;font-weight:800;color:var(--yellow);margin-bottom:10px}
.cbox{width:100%;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;font-family:inherit;color:var(--text);outline:none;resize:vertical;min-height:54px;margin-bottom:8px}
.cbox:focus{border-color:var(--primary)}
.action-btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);font-size:12px;font-weight:700;font-family:inherit;cursor:pointer;border:none;transition:all 0.15s}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{box-shadow:0 4px 14px rgba(22,163,74,0.3)}
.btn-red{background:transparent;color:var(--red);border:1px solid rgba(220,38,38,0.4)}.btn-red:hover{background:rgba(220,38,38,0.08)}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border2)}.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-sm{padding:6px 12px;font-size:11px}
.info-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:12px;font-size:12px;color:var(--text-muted)}
.comment-box{margin-bottom:12px}
.obs-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.obs-item{padding:10px 12px;border-radius:var(--radius-sm);border-left:3px solid var(--border2);background:var(--surface2)}
.obs-meta{font-size:10px;color:var(--text-dim);margin-bottom:3px;display:flex;gap:8px}.obs-text{font-size:13px}
.toast-container{position:fixed;top:70px;right:20px;z-index:999;display:flex;flex-direction:column;gap:8px}
.toast{padding:11px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;animation:toastIn 0.25s ease;max-width:320px}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.toast.ok{background:#1a3a2a;border:1px solid #22c55e33;color:#4ade80}.toast.err{background:#3a1a1a;border:1px solid #ef444433;color:#f87171}.toast.inf{background:#1a2a3a;border:1px solid #3b82f633;color:#60a5fa}
#load-overlay{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.loader-logo img{height:56px;width:auto}.loader-bar{width:200px;height:3px;background:var(--surface3);border-radius:99px;overflow:hidden}
.loader-fill{height:100%;width:0;background:var(--gradient);border-radius:99px;animation:lAnim 1.4s ease-in-out infinite}
@keyframes lAnim{0%{width:0;margin-left:0}50%{width:60%;margin-left:20%}100%{width:0;margin-left:100%}}
.gate{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:9998;padding:20px}
.gate-card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:40px;max-width:420px;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,0.12)}
.gate-card h2{font-family:'Syne',sans-serif;font-size:20px;margin:14px 0 8px}.gate-card p{font-size:13px;color:var(--text-muted)}
.empty{text-align:center;padding:50px 20px;color:var(--text-muted)}
@media(max-width:768px){.topbar{padding:0 12px}.main{padding:20px 14px}.camp-hero{padding:18px}.tal-head{padding:14px 16px}.tal-body{padding:0 14px 14px}.action-btns{flex-direction:column}.action-btns .btn{width:100%;justify-content:center}.toast-container{right:12px;left:12px}.toast{max-width:100%}}
</style>
</head>
<body>

<div id="load-overlay">
  <div class="loader-logo"><img src="assets/brand/logos/Beme1Color.png" alt="Beme"></div>
  <div class="loader-bar"><div class="loader-fill"></div></div>
  <div id="load-msg" style="font-size:12px;color:var(--text-muted)">Cargando campaña...</div>
</div>

<div class="gate" id="gate">
  <div class="gate-card">
    <div class="loader-logo"><img src="assets/brand/logos/Beme1Color.png" alt="Beme"></div>
    <h2 id="gate-title">Link no válido</h2>
    <p id="gate-msg">Este link expiró o fue desactivado. Pedile a tu contacto en Beme uno nuevo.</p>
  </div>
</div>

<div class="toast-container" id="toasts"></div>

<div id="app" style="display:none">
  <header class="topbar">
    <a href="#" class="logo"><img src="assets/brand/logos/Beme1Color.png" alt="Beme" class="logo-light"><img src="assets/brand/logos/Beme1blanco.png" alt="Beme" class="logo-dark"></a>
    <span class="role-tag">Marca</span>
    <div class="topbar-right">
      <button class="icon-btn" onclick="toggleTheme()" title="Tema">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
      </button>
    </div>
  </header>
  <main class="main">
    <div id="hero"></div>
    <div id="briefs"></div>
    <div class="section-label">Talentos & Contenidos</div>
    <div id="talentos-container"></div>
  </main>
</div>

<script>
const SB_URL = 'https://ngstqwbzvnpggpklifat.supabase.co';
const SB_KEY = 'sb_publishable_1E2K-9D-KzOSVCgROnfa-g_-WCnWCDb';
const sbStore = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false } }); // solo para uploadToSignedUrl
const API_URL = '/.netlify/functions/magic-api';
const TOKEN = new URLSearchParams(location.search).get('t') || '';
let campana = null, notifyEmails = [];

const PASO_LABELS = {1:'Esperando Brief',2:'Esperando Script',3:'Aprobación Script',4:'Producción',5:'Aprobación Contenido',6:'Publicar',7:'Estadísticas',8:'Completado',9:'Pagado'};
const TIPO_LABELS = {tiktok_video:'TikTok Video',reel:'Reel',reel_tiktok_espejo:'Reel/TikTok',ig_story:'IG Story',youtube_video:'YouTube Video',youtube_short:'YouTube Short'};

async function API(action, params={}) {
  const res = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ action, token: TOKEN, ...params }) });
  const data = await res.json().catch(()=>({error:'Respuesta inválida'}));
  if (!res.ok) { const e = new Error(data.error||('Error '+res.status)); e.invalid = data.invalid; throw e; }
  return data;
}
function showGate(title, msg) {
  document.getElementById('load-overlay').style.display='none';
  document.getElementById('app').style.display='none';
  document.getElementById('gate-title').textContent = title;
  document.getElementById('gate-msg').textContent = msg;
  document.getElementById('gate').style.display='flex';
}
async function init() {
  if (!TOKEN) { showGate('Link incompleto','Falta el código de acceso en el link.'); return; }
  try {
    const data = await load();
    if (data.expired) { showGate('Campaña finalizada','Esta campaña ya cerró y el acceso expiró. Gracias por trabajar con nosotros.'); return; }
    document.getElementById('load-overlay').style.display='none';
    document.getElementById('app').style.display='block';
    renderAll();
  } catch(e) {
    if (e.invalid) showGate('Link no válido','Este link expiró o fue desactivado. Pedile a tu contacto en Beme uno nuevo.');
    else showGate('No pudimos cargar', e.message);
  }
}
async function load() {
  const data = await API('load');
  if (data.expired) return data;
  campana = data.campana;
  notifyEmails = data.notifyEmails || [];
  return data;
}
async function refresh() { await load(); renderAll(); }

function renderAll() {
  const estadoLabels = {sin_iniciar:'Sin iniciar',en_curso:'En curso',etapa_finanzas:'Finanzas',finalizada:'Finalizada',cancelada:'Cancelada'};
  const cli = campana.marcas?.clientes?.nombre||'';
  document.getElementById('hero').innerHTML = `<div class="camp-hero">
    <div class="logo-box">${(campana.marcas?.nombre||'?').substring(0,2).toUpperCase()}</div>
    <div style="flex:1;min-width:0">
      <h1>${esc(campana.nombre)}</h1>
      <div class="sub">${esc(cli)} ${campana.marcas?.nombre?'· '+esc(campana.marcas.nombre):''}</div>
    </div>
    <span class="estado-badge estado-${campana.estado}">${estadoLabels[campana.estado]||campana.estado}</span>
  </div>`;

  const briefs = campana.campana_briefs||[];
  const briefsLinks = briefs.length
    ? briefs.map(f=>`<a href="${esc(f.url)}" target="_blank" class="brief-file">📄 ${esc((f.nombre||'Brief').substring(0,40))}</a>`).join('')
    : '<span style="font-size:12px;color:var(--text-dim)">Todavía no hay briefs generales.</span>';
  document.getElementById('briefs').innerHTML = `<div class="brief-section">
    <div class="brief-title">📄 Brief general de la campaña</div>
    <div style="margin-bottom:10px">${briefsLinks}</div>
    <label class="btn btn-outline btn-sm" style="cursor:pointer"><input type="file" style="display:none" multiple onchange="uploadBriefGeneral(this)">⬆ Subir brief general</label>
  </div>
  <div class="brief-section">
    <div class="brief-title">💬 Comentario general para el equipo</div>
    <textarea class="cbox" id="camp-comment" placeholder="Dejá indicaciones o comentarios extra sobre la campaña en general..."></textarea>
    <div class="action-btns"><button class="btn btn-outline btn-sm" onclick="sendCampaignComment()">Enviar comentario</button></div>
  </div>
  <div class="brief-section">
    <div class="brief-title">🔔 Notificaciones por email</div>
    <p style="font-size:12px;color:var(--text-muted);margin-bottom:10px">Te avisamos por mail cuando haya algo para revisar: script listo, contenido para aprobar, spark code y estadísticas.</p>
    <div id="emails-chips" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px"></div>
    <div style="display:flex;gap:8px">
      <input type="email" id="email-input" placeholder="tu@email.com" style="flex:1;background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:9px 12px;font-size:13px;font-family:inherit;color:var(--text);outline:none" onkeydown="if(event.key==='Enter')addNotifyEmail()">
      <button class="btn btn-outline btn-sm" onclick="addNotifyEmail()">+ Agregar</button>
    </div>
  </div>`;
  renderEmails();

  const cts = campana.campana_talentos||[];
  const cont = document.getElementById('talentos-container');
  if (!cts.length) { cont.innerHTML = '<div class="empty">Esta campaña todavía no tiene talentos asignados.</div>'; return; }
  const openIds = []; cont.querySelectorAll('.open').forEach(el=>{ if(el.id) openIds.push(el.id); });
  cont.innerHTML = cts.map(ct=>renderTalento(ct)).join('');
  openIds.forEach(id=>{ const el=document.getElementById(id); if(el) el.classList.add('open'); });
}

function renderTalento(ct) {
  const t = ct.talentos||{};
  const ini = (t.nombre||'?').split(' ').map(n=>n[0]||'').join('').substring(0,2).toUpperCase();
  const conts = ct.contenidos||[];
  const done = conts.filter(c=>c.paso_actual>=8).length;
  const mon = ct.moneda||'USD';
  return `<div class="tal-card" id="tc-${ct.id}">
    <div class="tal-head" onclick="toggle('tc-${ct.id}')">
      <div class="t-avatar">${t.foto?`<img src="${esc(t.foto)}" loading="lazy">`:ini}</div>
      <div style="flex:1;min-width:0">
        <div class="t-name">${esc(t.nombre||'—')}</div>
        <div class="t-meta">${conts.length} contenido${conts.length!==1?'s':''} · ${done} completado${done!==1?'s':''}</div>
      </div>
      <div class="fee-chip"><div class="lbl">A pagar</div><div class="val">${fmtMoney(ct.fee_marca||0,mon)}</div></div>
      <svg class="cam-expand" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="tal-body">
      ${conts.length ? conts.map(c=>renderContenido(c)).join('') : '<div style="font-size:12px;color:var(--text-dim);padding:12px 0">Sin contenidos.</div>'}
    </div>
  </div>`;
}

function renderContenido(c) {
  const paso = c.paso_actual;
  const isDone = paso>=8;
  const inReview = paso===3 || paso===5;
  const chipCls = isDone?'done':inReview?'review':'';
  const scripts = (c.contenido_scripts||[]).sort((a,b)=>(b.version||1)-(a.version||1));
  const drafts = (c.contenido_borradores||[]).sort((a,b)=>(b.version||1)-(a.version||1));

  // Archivos visibles para la marca
  let files = '';
  if (scripts.length) files += scripts.map(s=>`<a href="${esc(s.url_archivo)}" target="_blank" class="file-btn">📝 Script v${s.version||1}</a>`).join('');
  if (drafts.length) files += drafts.map(d=>`<a href="${esc(d.url_archivo)}" target="_blank" class="file-btn" style="color:#e1306c">🎬 ${esc((d.nombre_archivo||'Video').substring(0,22))}</a>`).join('');
  if (c.url_publicacion) files += `<a href="${esc(c.url_publicacion)}" target="_blank" class="file-btn" style="color:var(--green)">🔗 Publicación</a>`;
  if (c.copy_texto) files += `<span class="file-btn" style="color:var(--text-muted);cursor:default" title="${esc(c.copy_texto)}">📋 Copy</span>`;
  const filesHTML = files ? `<div class="files-row">${files}</div>` : '<div class="info-box">Todavía no hay archivos para revisar en este contenido.</div>';

  // Acción de revisión
  let actionHTML = '';
  if (inReview) {
    const what = paso===3 ? 'el script' : 'el contenido';
    actionHTML = `<div class="review-box">
      <div class="review-title">⏳ Esperando tu revisión de ${what}</div>
      <textarea class="cbox" id="rev-${c.id}" placeholder="Comentario (opcional para aprobar, obligatorio para pedir cambios)..."></textarea>
      <div class="action-btns">
        <button class="btn btn-green btn-sm" onclick="approve(${c.id})">✓ Aprobar</button>
        <button class="btn btn-red btn-sm" onclick="reject(${c.id})">↩ Pedir cambios</button>
      </div>
    </div>`;
  } else if (isDone) {
    actionHTML = `<div class="info-box" style="color:var(--green);font-weight:700">✓ ${paso===9?'Pagado':'Completado'}</div>`;
  } else {
    actionHTML = `<div class="info-box">El talento está trabajando en este paso. Te avisaremos cuando esté listo para tu aprobación.</div>`;
  }

  // Brief específico de este contenido
  const cBriefs = (c.contenido_briefs||[]).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
  const briefBtns = cBriefs.length ? cBriefs.map(b=>`<a href="${esc(b.url)}" target="_blank" class="file-btn" style="color:var(--purple)">📋 ${esc((b.nombre||'Brief').substring(0,20))}</a>`).join('') : '';
  const briefHTML = `<div style="margin-bottom:12px">
    <div style="font-size:11px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px">Brief de este contenido</div>
    ${briefBtns?`<div class="files-row">${briefBtns}</div>`:''}
    <label class="btn btn-outline btn-sm" style="cursor:pointer"><input type="file" style="display:none" multiple onchange="uploadBriefContent(this,${c.id})">⬆ Subir brief del contenido</label>
  </div>`;

  // Comentario libre (siempre disponible)
  const commentHTML = `<div class="comment-box">
    <textarea class="cbox" id="com-${c.id}" placeholder="Dejá un comentario para el equipo y el talento..."></textarea>
    <div class="action-btns"><button class="btn btn-outline btn-sm" onclick="comment(${c.id})">💬 Enviar comentario</button></div>
  </div>`;

  const obsHTML = renderObs(c.contenido_observaciones||[]);

  return `<div class="cont-card" id="cont-${c.id}">
    <div class="cont-head" onclick="toggle('cont-${c.id}')">
      <span class="tipo-badge">${TIPO_LABELS[c.tipo]||c.tipo}</span>
      <span class="cont-titulo">${esc(c.titulo||TIPO_LABELS[c.tipo]||'Contenido')}</span>
      <span class="paso-chip ${chipCls}">${isDone?'✓ Completo':inReview?'Revisión':'Paso '+paso}</span>
      <svg class="cont-expand" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="cont-body">
      <div style="font-size:11px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px">Etapa actual: ${PASO_LABELS[paso]||('Paso '+paso)}</div>
      ${filesHTML}
      ${actionHTML}
      ${briefHTML}
      ${commentHTML}
      ${obsHTML}
    </div>
  </div>`;
}

function renderObs(obs) {
  if (!obs.length) return '';
  const sorted = [...obs].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
  return `<div style="font-size:11px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px">Historial de feedback</div>
    <div class="obs-list">${sorted.map(o=>`<div class="obs-item"><div class="obs-meta"><span>${esc(o.autor_nombre||'?')}</span><span>${fmtDT(o.created_at)}</span></div><div class="obs-text">${esc(o.observacion)}</div></div>`).join('')}</div>`;
}

// ── ACCIONES ───────────────────────────────────────────────────
async function approve(contId) {
  const obs = document.getElementById('rev-'+contId)?.value.trim() || '';
  try { const r = await API('approve', { contenido_id: contId, observacion: obs }); await refresh(); toast('Aprobado → '+(PASO_LABELS[r.paso]||r.paso),'ok'); }
  catch(e){ toast('Error: '+e.message,'err'); }
}
async function reject(contId) {
  const obs = document.getElementById('rev-'+contId)?.value.trim() || '';
  if (!obs) { toast('Escribí qué cambios pedís antes de rechazar','err'); return; }
  try { const r = await API('reject', { contenido_id: contId, observacion: obs }); await refresh(); toast('Devuelto al talento para cambios','ok'); }
  catch(e){ toast('Error: '+e.message,'err'); }
}
async function comment(contId) {
  const obs = document.getElementById('com-'+contId)?.value.trim() || '';
  if (!obs) { toast('Escribí un comentario','err'); return; }
  try { await API('comment', { contenido_id: contId, observacion: obs }); await refresh(); toast('Comentario enviado ✓','ok'); }
  catch(e){ toast('Error: '+e.message,'err'); }
}
async function sendCampaignComment() {
  const msg = document.getElementById('camp-comment')?.value.trim() || '';
  if (!msg) { toast('Escribí un comentario','err'); return; }
  try { await API('campaign-comment', { mensaje: msg }); document.getElementById('camp-comment').value=''; toast('Comentario enviado al equipo ✓','ok'); }
  catch(e){ toast('Error: '+e.message,'err'); }
}

// ── NOTIFICACIONES POR EMAIL (marca) ───────────────────────────
function renderEmails() {
  const wrap = document.getElementById('emails-chips');
  if (!wrap) return;
  wrap.innerHTML = notifyEmails.length
    ? notifyEmails.map(e=>`<span class="file-btn" style="cursor:default;color:var(--text)">${esc(e)} <span style="cursor:pointer;color:var(--red);font-weight:800;margin-left:4px" onclick="removeNotifyEmail('${esc(e)}')">✕</span></span>`).join('')
    : '<span style="font-size:12px;color:var(--text-dim)">Sin emails registrados todavía.</span>';
}
async function saveEmails() {
  try { const r = await API('set-emails', { emails: notifyEmails }); notifyEmails = r.notifyEmails || []; renderEmails(); return true; }
  catch(e){ toast('Error: '+e.message,'err'); return false; }
}
async function addNotifyEmail() {
  const inp = document.getElementById('email-input');
  const val = (inp?.value||'').trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) { toast('Email inválido','err'); return; }
  if (notifyEmails.includes(val)) { toast('Ya está registrado','inf'); return; }
  notifyEmails = [...notifyEmails, val];
  if (await saveEmails()) { inp.value=''; toast('Email agregado ✓','ok'); }
}
async function removeNotifyEmail(email) {
  notifyEmails = notifyEmails.filter(e=>e!==email);
  if (await saveEmails()) toast('Email quitado','inf');
}

// ── SUBIR BRIEFS (marca) ───────────────────────────────────────
async function uploadBriefOne(kind, contId, file) {
  const su = await API('signed-upload-brief', { kind, contenido_id: contId||null, filename: file.name });
  const { error } = await sbStore.storage.from('campaign-briefs').uploadToSignedUrl(su.path, su.token, file);
  if (error) throw error;
  return su.publicUrl || su.path;
}
async function uploadBriefGeneral(input) {
  const files = Array.from(input.files); input.value=''; if (!files.length) return;
  toast('Subiendo brief general...','inf');
  try { for (const f of files){ const url = await uploadBriefOne('general', null, f); await API('record-brief-general',{url,nombre:f.name,size_bytes:f.size}); }
    await refresh(); toast(files.length>1?`${files.length} briefs subidos ✓`:'Brief general subido ✓','ok');
  } catch(e){ toast('Error: '+e.message,'err'); }
}
async function uploadBriefContent(input, contId) {
  const files = Array.from(input.files); input.value=''; if (!files.length) return;
  toast('Subiendo brief del contenido...','inf');
  try { for (const f of files){ const url = await uploadBriefOne('content', contId, f); await API('record-brief-content',{contenido_id:contId,url,nombre:f.name,size_bytes:f.size}); }
    await refresh(); toast('Brief del contenido subido ✓','ok');
  } catch(e){ toast('Error: '+e.message,'err'); }
}

// ── UTILS ──────────────────────────────────────────────────────
function toggle(id){ document.getElementById(id)?.classList.toggle('open'); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDT(d){ if(!d) return ''; return new Date(d).toLocaleString('es-ES',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
function fmtMoney(n,cur='USD'){ try { return new Intl.NumberFormat('es-MX',{style:'currency',currency:cur,maximumFractionDigits:2}).format(n||0); } catch { return (cur+' '+(n||0)); } }
function toast(msg,type='inf',dur=3500){ const icons={ok:'✓',err:'✕',inf:'ℹ'}; const t=document.createElement('div'); t.className='toast '+type; t.innerHTML=`<span>${icons[type]||'•'}</span><span>${esc(msg)}</span>`; document.getElementById('toasts').appendChild(t); setTimeout(()=>t.remove(),dur); }
function toggleTheme(){ document.body.classList.toggle('dark'); localStorage.setItem('beme_theme', document.body.classList.contains('dark')?'dark':'light'); }
if (localStorage.getItem('beme_theme')==='dark') document.body.classList.add('dark');

init();
setTimeout(()=>{ const lo=document.getElementById('load-overlay'); if(lo&&lo.style.display!=='none'&&document.getElementById('gate').style.display!=='flex') lo.style.display='none'; }, 15000);
</script>
