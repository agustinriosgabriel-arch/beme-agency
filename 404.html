<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada — Beme Agency</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --magenta:#b2005d; --purple:#9414E0; --pink:#ed568f; --hot:#d90e86;
  --black:#0f0f11; --white:#f4f4f4; --gray:#9b9ba4;
  --g-brand:linear-gradient(96deg,#ed568f 0%,#d90e86 30%,#9414e0 70%,#ed568f 100%);
  --font:'Just Sans','Inter','Helvetica Neue',Arial,sans-serif;
  --ease:cubic-bezier(.22,.8,.26,.99);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{
  min-height:100vh;display:grid;place-items:center;padding:32px;
  background:var(--black);color:var(--white);font-family:var(--font);
  text-align:center;position:relative;overflow:hidden;
}
.blob{position:absolute;border-radius:50%;filter:blur(120px);opacity:.28;pointer-events:none}
.b1{width:520px;height:520px;background:var(--purple);top:-180px;left:-160px}
.b2{width:460px;height:460px;background:var(--magenta);bottom:-200px;right:-140px}
.wrap{position:relative;z-index:1;max-width:560px}
.code{
  font-size:clamp(96px,20vw,180px);font-weight:900;line-height:.9;letter-spacing:-.05em;
  background:var(--g-brand);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
h1{margin-top:24px;font-size:clamp(24px,4vw,34px);font-weight:800;letter-spacing:-.02em}
p{margin-top:14px;color:var(--gray);font-size:16px;line-height:1.65;font-weight:300}
.actions{margin-top:36px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
a.btn{
  display:inline-block;padding:14px 30px;border-radius:100px;text-decoration:none;
  font-size:14px;font-weight:600;letter-spacing:.01em;transition:transform .4s var(--ease),opacity .4s var(--ease);
}
a.solid{background:var(--g-brand);color:#fff}
a.ghost{border:1px solid rgba(244,244,244,.22);color:var(--white)}
a.btn:hover{transform:translateY(-2px);opacity:.9}
</style>
</head>
<body>
<div class="blob b1" aria-hidden="true"></div>
<div class="blob b2" aria-hidden="true"></div>
<main class="wrap">
  <div class="code">404</div>
  <h1>Esta página no existe</h1>
  <p>El link que seguiste no lleva a ningún lado. Volvé al inicio o escribinos y lo resolvemos.</p>
  <div class="actions">
    <a class="btn solid" href="/">Ir al inicio</a>
    <a class="btn ghost" href="mailto:contacto@bemeagency.com">Escribinos</a>
  </div>
</main>
</body>
</html>
