<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beme — Bandeja</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.0/dist/umd/supabase.js"></script>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--surface:#181818;--surface2:#202020;--surface3:#2a2a2a;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.13);
  --primary:#b2005d;--primary-light:#ed568f;--primary-dark:#8a0048;
  --purple:#9414E0;--purple-light:#b557f0;
  --gradient:linear-gradient(135deg,#b2005d 0%,#9414E0 100%);
  --gradient-h:linear-gradient(135deg,#c8006a 0%,#a718f5 100%);
  --text:#f4f4f4;--text-muted:#7a7a8a;--text-dim:#444455;
  --radius:12px;--radius-sm:8px;--radius-md:14px;--radius-lg:18px;
  --shadow:0 4px 28px rgba(0,0,0,0.55);--shadow-p:0 4px 20px rgba(178,0,93,0.35);
}
body.light{
  --bg:#f4f4f4;--surface:#ffffff;--surface2:#f0f0f0;--surface3:#e8e8e8;
  --border:rgba(0,0,0,0.07);--border2:rgba(0,0,0,0.13);
  --text:#1c1c1c;--text-muted:#5a5a6a;--text-dim:#aaaabd;
  --shadow:0 4px 28px rgba(0,0,0,0.10);--shadow-p:0 4px 20px rgba(178,0,93,0.28);
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:'Syne',sans-serif}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:99px}

.topbar{position:sticky;top:0;z-index:100;background:rgba(15,15,15,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 24px;height:62px}
body.light .topbar{background:rgba(244,244,244,0.95)}
.logo{display:flex;align-items:center}
.logo img{height:44px;width:auto}
.logo .logo-dark{display:none}
body.dark .logo .logo-light{display:none}
body.dark .logo .logo-dark{display:block}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.theme-toggle{width:36px;height:36px;border-radius:50%;border:1px solid var(--border2);background:var(--surface2);color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0}
.theme-toggle:hover{border-color:var(--primary);color:var(--primary)}

.tab-nav{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--border);padding:0 24px;background:rgba(15,15,15,0.7);backdrop-filter:blur(10px);position:sticky;top:62px;z-index:99}
body.light .tab-nav{background:rgba(244,244,244,0.9)}
.tab-btn{display:flex;align-items:center;gap:7px;padding:12px 18px;font-size:13px;font-weight:600;color:var(--text-muted);border:none;background:transparent;cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;margin-bottom:-1px;font-family:'Plus Jakarta Sans',sans-serif}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:24px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all 0.18s;font-family:'Plus Jakarta Sans',sans-serif;white-space:nowrap}
.btn-primary{background:var(--gradient);color:#fff;box-shadow:var(--shadow-p)}
.btn-primary:hover{background:var(--gradient-h)}
.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text-muted)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-ghost{background:transparent;color:var(--text-muted);padding:7px 12px}
.btn-ghost:hover{color:var(--text)}
.btn-success{background:rgba(34,197,94,0.1);color:#4ade80;border:1px solid rgba(34,197,94,0.2)}
.btn-success:hover{background:rgba(34,197,94,0.2)}
.btn-sm{padding:6px 12px;font-size:12px}

.main{padding:24px 28px;max-width:1400px;width:100%;margin:0 auto}
.page-header{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.page-header h1{font-size:24px;font-weight:800;letter-spacing:-0.5px}
.page-header p{font-size:13px;color:var(--text-muted);margin-top:2px}
.page-header-actions{margin-left:auto;display:flex;gap:10px;align-items:center}

.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
.stat-card .label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim)}
.stat-card .value{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;margin-top:4px;line-height:1}
.stat-card .sub{font-size:11px;color:var(--text-muted);margin-top:4px}
.stat-card.highlight{background:linear-gradient(135deg,rgba(178,0,93,0.06),rgba(148,20,224,0.06));border-color:rgba(178,0,93,0.15)}

.segmented{display:inline-flex;background:var(--surface2);border:1px solid var(--border);border-radius:24px;padding:3px;margin-bottom:18px}
.seg-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border:none;background:transparent;color:var(--text-muted);font-size:13px;font-weight:600;border-radius:20px;cursor:pointer;font-family:inherit;transition:all 0.18s}
.seg-btn.active{background:var(--gradient);color:#fff;box-shadow:var(--shadow-p)}
.seg-count{font-size:11px;background:rgba(255,255,255,0.18);padding:1px 7px;border-radius:20px}
.seg-btn:not(.active) .seg-count{background:var(--surface3);color:var(--text-muted)}

.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:360px}
.search-wrap > svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-dim);pointer-events:none}
.search-input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:24px;padding:8px 14px 8px 36px;font-size:13px;font-family:inherit;outline:none;transition:border 0.2s}
.search-input:focus{border-color:var(--primary)}
.filter-select{background:var(--surface2);border:1px solid var(--border);border-radius:24px;padding:8px 14px;font-size:13px;font-family:inherit;color:var(--text);outline:none;cursor:pointer;appearance:none}
.filter-select:focus{border-color:var(--primary)}

/* ── Inbox cards ── */
.inbox-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.mail-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden}
.mail-card::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;background:var(--gradient);opacity:0;transition:opacity 0.2s}
.mail-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:var(--shadow)}
.mail-card:hover::before{opacity:1}
.mail-card.nuevo::before{opacity:1}
.mail-head{display:flex;align-items:flex-start;gap:11px;margin-bottom:10px}
.mail-avatar{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:linear-gradient(135deg,rgba(178,0,93,0.15),rgba(148,20,224,0.15));color:var(--primary-light);font-weight:800;font-size:14px;border:1px solid rgba(178,0,93,0.2)}
.mail-meta{flex:1;min-width:0}
.mail-from{font-size:14px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail-email{font-size:11.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail-date{font-size:11px;color:var(--text-dim);flex-shrink:0;white-space:nowrap}
.mail-subject{font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text);line-height:1.35}
.mail-resumen{font-size:12.5px;color:var(--text-muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mail-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.chip{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--surface2);color:var(--text-muted);border:1px solid var(--border);white-space:nowrap}
.chip.key{background:rgba(178,0,93,0.08);color:var(--primary-light);border-color:rgba(178,0,93,0.18)}
.badge{flex-shrink:0;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:0.3px;white-space:nowrap}
.b-nuevo{background:rgba(178,0,93,0.14);color:var(--primary-light)}
.b-visto{background:rgba(120,120,140,0.14);color:var(--text-muted)}
.b-gestionado{background:rgba(34,197,94,0.12);color:#4ade80}
.b-archivado{background:rgba(120,120,140,0.1);color:var(--text-dim)}
.b-exclusivo{background:linear-gradient(135deg,rgba(148,20,224,0.18),rgba(178,0,93,0.18));color:var(--purple-light);border:1px solid rgba(148,20,224,0.25);display:inline-flex;align-items:center;gap:4px}
.mail-foot{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.mail-foot .badge{margin-right:auto}

.empty-state{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-muted)}
.empty-state svg{opacity:0.2;margin-bottom:16px}
.empty-state h3{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px}
.empty-state p{font-size:13px}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.8);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity 0.2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);width:100%;max-width:680px;max-height:92vh;overflow-y:auto;transform:scale(0.95) translateY(12px);transition:transform 0.2s}
.modal-overlay.open .modal{transform:scale(1) translateY(0)}
.modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;position:sticky;top:0;background:var(--surface);z-index:1}
.modal-title{font-size:17px;font-weight:700;line-height:1.3}
.modal-close{width:32px;height:32px;border-radius:50%;border:none;background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-muted);transition:all 0.15s;flex-shrink:0}
.modal-close:hover{background:var(--surface3);color:var(--text)}
.modal-body{padding:20px 24px}
.modal-footer{padding:14px 24px 20px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--surface)}

.detail-row{display:flex;gap:10px;font-size:12.5px;margin-bottom:6px}
.detail-row .k{color:var(--text-dim);min-width:80px;flex-shrink:0}
.detail-row .v{color:var(--text);font-weight:500;word-break:break-word}
.section-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim);margin:18px 0 10px}
.datos-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
.datos-cell .k{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--text-dim)}
.datos-cell .v{font-size:13px;font-weight:600;margin-top:2px;word-break:break-word}
.resumen-box{background:var(--surface2);border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:var(--radius-sm);padding:12px 14px;font-size:13px;line-height:1.55;color:var(--text)}
.cuerpo-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;font-size:12.5px;line-height:1.55;color:var(--text-muted);white-space:pre-wrap;max-height:220px;overflow-y:auto}
.form-input{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:10px 12px;font-size:13.5px;font-family:'Plus Jakarta Sans',sans-serif;outline:none;transition:border 0.2s;width:100%}
.form-input:focus{border-color:var(--primary)}
textarea.form-input{resize:vertical;min-height:96px}

.reply-item{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;margin-bottom:8px}
.reply-item .rmeta{font-size:11px;color:var(--text-dim);margin-bottom:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.reply-item .rbody{font-size:12.5px;color:var(--text);white-space:pre-wrap;line-height:1.5}
.sent-flag{font-size:10px;font-weight:700;color:#4ade80;display:inline-flex;align-items:center;gap:3px}

/* ── Toast ── */
.toast-container{position:fixed;top:76px;right:20px;z-index:999;display:flex;flex-direction:column;gap:6px}
.toast{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:11px 14px;font-size:13px;color:var(--text);box-shadow:var(--shadow);min-width:230px;animation:slideIn 0.3s ease;display:flex;align-items:center;gap:8px}
.toast.success{border-left:3px solid #4ade80}
.toast.error{border-left:3px solid #ff6b6b}
.toast.info{border-left:3px solid var(--primary)}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}

/* ── Overlays ── */
#load-overlay{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.loader-logo img{height:56px;width:auto}
.loader-bar{width:200px;height:3px;background:var(--surface3);border-radius:99px;overflow:hidden}
.loader-fill{height:100%;width:0;background:var(--gradient);border-radius:99px;animation:loaderAnim 1.4s ease-in-out infinite}
@keyframes loaderAnim{0%{width:0;margin-left:0}50%{width:60%;margin-left:20%}100%{width:0;margin-left:100%}}
#login-overlay{position:fixed;inset:0;background:rgba(15,15,15,0.97);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:9999}
body.light #login-overlay{background:rgba(244,244,244,0.97)}
.login-card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:40px;width:100%;max-width:380px;box-shadow:var(--shadow)}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo img{height:48px;width:auto;margin-bottom:4px}
.login-logo p{font-size:13px;color:var(--text-muted);margin-top:8px}
.login-error{display:none;background:rgba(220,50,50,0.1);border:1px solid rgba(220,50,50,0.2);border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;color:#ff6b6b;margin-bottom:14px}
.login-fields{display:flex;flex-direction:column;gap:10px}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,0.35);border-top-color:#fff;border-radius:50%;animation:rot 0.7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

@media(max-width:900px){.stats-strip{grid-template-columns:repeat(2,1fr)}.inbox-grid{grid-template-columns:1fr}.datos-grid{grid-template-columns:1fr}}
@media(max-width:768px){.main{padding:16px}.topbar{padding:0 12px}.tab-nav{overflow-x:auto;padding:0 12px}.page-header{flex-wrap:wrap}}
</style>
</head>
<body>

<!-- LOADING OVERLAY -->
<div id="load-overlay">
  <div class="loader-logo"><img src="assets/brand/logos/Beme1Color.png" alt="Beme"></div>
  <div class="loader-bar"><div class="loader-fill"></div></div>
  <p style="font-size:12px;color:var(--text-dim);margin-top:8px" id="load-msg">Conectando...</p>
</div>

<!-- LOGIN OVERLAY -->
<div id="login-overlay" style="display:none">
  <div class="login-card">
    <div class="login-logo"><img src="assets/brand/logos/Beme1Color.png" alt="Beme" style="height:48px"><p>Bandeja</p></div>
    <div class="login-error" id="login-error"></div>
    <div class="login-fields">
      <input type="email" id="login-email" class="form-input" placeholder="Email">
      <input type="password" id="login-pass" class="form-input" placeholder="Contraseña" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:6px" id="login-btn" onclick="doLogin()">Ingresar</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toast-container"></div>

<!-- TOPBAR -->
<header class="topbar">
  <a href="index.html" class="logo">
    <img src="assets/brand/logos/Beme1Color.png" alt="Beme" class="logo-light">
    <img src="assets/brand/logos/Beme1blanco.png" alt="Beme" class="logo-dark">
  </a>
  <div class="topbar-right">
    <button class="theme-toggle" onclick="toggleTheme()" title="Cambiar tema">
      <svg id="theme-icon-dark" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      <svg id="theme-icon-light" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <button class="theme-toggle" onclick="doLogout()" title="Cerrar sesión">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>
</header>

<!-- TAB NAV -->
<nav class="tab-nav">
  <a class="tab-btn" href="index.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Talentos</a>
  <a class="tab-btn" href="campanas.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Campañas</a>
  <a class="tab-btn" href="prospecciones.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>Prospección</a>
  <a class="tab-btn active" href="bandeja.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>Bandeja</a>
  <a class="tab-btn" href="contratos.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Contratos</a>
  <a class="tab-btn" href="presupuestos.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12V8H6a2 2 0 0 1 0-4h12v4"/><path d="M4 6v12a2 2 0 0 0 2 2h14v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>Presupuestos</a>
</nav>

<!-- MAIN -->
<main class="main" id="app" style="display:none">
  <div class="page-header">
    <div>
      <h1>Bandeja</h1>
      <p id="subtitle-count">Cargando...</p>
    </div>
    <div class="page-header-actions">
      <button class="btn btn-outline" id="sync-btn" onclick="sincronizar()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        Sincronizar
      </button>
    </div>
  </div>

  <div class="stats-strip">
    <div class="stat-card highlight"><div class="label">Nuevos</div><div class="value" id="stat-nuevos">0</div><div class="sub">sin revisar</div></div>
    <div class="stat-card"><div class="label">Cotizaciones</div><div class="value" id="stat-cotizaciones" style="color:#38bdf8">0</div><div class="sub">de marcas</div></div>
    <div class="stat-card"><div class="label">Propuestas</div><div class="value" id="stat-propuestas" style="color:#b557f0">0</div><div class="sub">de creadores</div></div>
    <div class="stat-card"><div class="label">Talentos</div><div class="value" id="stat-exclusivos" style="color:#4ade80">0</div><div class="sub">exclusivos</div></div>
  </div>

  <div class="segmented">
    <button class="seg-btn active" id="seg-contacto" onclick="setCasilla('contacto')">Cotizaciones (marcas) <span class="seg-count" id="count-contacto">0</span></button>
    <button class="seg-btn" id="seg-management" onclick="setCasilla('management')">Talentos / Propuestas <span class="seg-count" id="count-management">0</span></button>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" class="search-input" id="search-input" placeholder="Buscar remitente, asunto, marca..." oninput="renderList()">
    </div>
    <select class="filter-select" id="filter-estado" onchange="renderList()">
      <option value="">Todos</option>
      <option value="nuevo">Nuevos</option>
      <option value="visto">Vistos</option>
      <option value="gestionado">Gestionados</option>
      <option value="archivado">Archivados</option>
    </select>
  </div>

  <div id="list-container" class="inbox-grid"></div>
</main>

<!-- DETAIL MODAL -->
<div class="modal-overlay" id="modal-detalle">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="d-title">—</div>
      <button class="modal-close" onclick="closeModal('modal-detalle')"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body" id="d-body"></div>
    <div class="modal-footer" id="d-footer"></div>
  </div>
</div>

<script>
// ── CONFIG ──
const SUPABASE_URL = 'https://ngstqwbzvnpggpklifat.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1E2K-9D-KzOSVCgROnfa-g_-WCnWCDb';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const FN = '/.netlify/functions';

let currentUser = null;
let mails = [];
let currentCasilla = 'contacto';
let isDark = false;
let detailId = null;

// ── AUTH ──
async function doLogin(){
  const email=(document.getElementById('login-email').value||'').trim();
  const pass=document.getElementById('login-pass').value||'';
  const btn=document.getElementById('login-btn');
  if(!email||!pass){ showLoginErr('Completá email y contraseña.'); return; }
  btn.textContent='Ingresando...'; btn.disabled=true;
  try{
    const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error){ showLoginErr(error.message); } else { currentUser=data.user; await initApp(); }
  }catch(e){ showLoginErr('Error: '+e.message); }
  btn.textContent='Ingresar'; btn.disabled=false;
}
function showLoginErr(m){ const d=document.getElementById('login-error'); d.textContent=m; d.style.display='block'; }
async function checkAuth(){
  const {data:{session}}=await sb.auth.getSession();
  if(session){ currentUser=session.user; await initApp(); }
  else{ document.getElementById('load-overlay').style.display='none'; document.getElementById('login-overlay').style.display='flex'; }
}
async function doLogout(){ await sb.auth.signOut(); location.reload(); }

// ── INIT ──
async function initApp(){
  document.getElementById('load-msg').textContent='Cargando mails...';
  try{
    const {data:profile}=await sb.from('user_profiles').select('*').eq('id',currentUser.id).single();
    if(!profile){ document.getElementById('login-overlay').style.display='flex'; showLoginErr('Tu usuario no tiene perfil. Contactá al administrador.'); document.getElementById('load-overlay').style.display='none'; return; }
    if(profile.role==='talent'){ location.href='talento-portal.html'; return; }
    await loadData();
    document.getElementById('login-overlay').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('load-overlay').style.display='none';
    renderAll();
  }catch(e){ console.error(e); showToast('Error al cargar: '+e.message,'error'); document.getElementById('load-overlay').style.display='none'; }
}

async function loadData(){
  const {data,error}=await sb.from('bandeja_emails').select('*').order('recibido_en',{ascending:false}).limit(400);
  if(error) throw error;
  mails=data||[];
}

// ── RENDER ──
function setCasilla(c){
  currentCasilla=c;
  document.getElementById('seg-contacto').classList.toggle('active',c==='contacto');
  document.getElementById('seg-management').classList.toggle('active',c==='management');
  renderList();
}
function renderAll(){ renderStats(); renderList(); }

function renderStats(){
  document.getElementById('stat-nuevos').textContent=mails.filter(m=>m.estado==='nuevo').length;
  document.getElementById('stat-cotizaciones').textContent=mails.filter(m=>m.casilla==='contacto').length;
  document.getElementById('stat-propuestas').textContent=mails.filter(m=>m.casilla==='management').length;
  document.getElementById('stat-exclusivos').textContent=mails.filter(m=>m.es_talento_exclusivo).length;
  document.getElementById('count-contacto').textContent=mails.filter(m=>m.casilla==='contacto').length;
  document.getElementById('count-management').textContent=mails.filter(m=>m.casilla==='management').length;
  const nuevos=mails.filter(m=>m.estado==='nuevo').length;
  document.getElementById('subtitle-count').textContent=`${mails.length} mensajes · ${nuevos} nuevos`;
}

function renderList(){
  const q=(document.getElementById('search-input').value||'').toLowerCase().trim();
  const estado=document.getElementById('filter-estado').value;
  let list=mails.filter(m=>m.casilla===currentCasilla);
  if(estado) list=list.filter(m=>m.estado===estado);
  if(q) list=list.filter(m=>{
    const d=m.datos||{};
    return [m.remitente_nombre,m.remitente_email,m.asunto,m.resumen,m.talento_nombre,d.marca,d.creador].join(' ').toLowerCase().includes(q);
  });
  const c=document.getElementById('list-container');
  if(!list.length){
    c.innerHTML=`<div class="empty-state">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
      <h3>Sin mensajes acá</h3><p>Cuando lleguen mails a esta casilla, los vas a ver resumidos aquí.<br>Probá <b>Sincronizar</b> para traer los últimos.</p></div>`;
    return;
  }
  c.innerHTML=list.map(m=>mailCard(m)).join('');
}

function mailCard(m){
  const d=m.datos||{};
  const initials=(m.remitente_nombre||m.remitente_email||'?').trim().slice(0,2).toUpperCase();
  const chips=keyChips(m).slice(0,4).map(t=>`<span class="chip key">${escHtml(t)}</span>`).join('');
  const excl=m.es_talento_exclusivo?`<span class="badge b-exclusivo"><svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7.4-6.3-4.6L5.7 21l2.3-7.4-6-4.6h7.6z"/></svg>${escHtml(m.talento_nombre||'Talento exclusivo')}</span>`:'';
  return `<div class="mail-card ${m.estado==='nuevo'?'nuevo':''}" onclick="openDetail(${m.id})">
    <div class="mail-head">
      <div class="mail-avatar">${escHtml(initials)}</div>
      <div class="mail-meta">
        <div class="mail-from">${escHtml(m.remitente_nombre||m.remitente_email||'Sin remitente')}</div>
        <div class="mail-email">${escHtml(m.remitente_email||'')}</div>
      </div>
      <div class="mail-date">${timeAgo(m.recibido_en)}</div>
    </div>
    <div class="mail-subject">${escHtml(m.asunto||'(sin asunto)')}</div>
    <div class="mail-resumen">${escHtml(m.resumen||'Sin resumen.')}</div>
    ${chips?`<div class="mail-chips">${chips}</div>`:''}
    <div class="mail-foot">
      <span class="badge b-${m.estado}">${estadoLabel(m.estado)}</span>
      ${excl}
    </div>
  </div>`;
}

function keyChips(m){
  const d=m.datos||{}; const out=[];
  if(d.marca) out.push('🏢 '+d.marca);
  if(d.campana) out.push('🎯 '+d.campana);
  if(d.presupuesto) out.push('💰 '+d.presupuesto+(d.moneda?' '+d.moneda:''));
  if(d.tarifa) out.push('💵 '+d.tarifa);
  if(d.deadline) out.push('📅 '+d.deadline);
  if(d.seguidores) out.push('👥 '+d.seguidores);
  if(Array.isArray(d.plataformas)&&d.plataformas.length) out.push('📱 '+d.plataformas.join(', '));
  if(d.tipo_contenido) out.push('🎬 '+d.tipo_contenido);
  return out;
}

// ── DETAIL ──
async function openDetail(id){
  const m=mails.find(x=>x.id===id); if(!m) return;
  detailId=id;
  document.getElementById('d-title').textContent=m.asunto||'(sin asunto)';
  const d=m.datos||{};
  const datosCells=Object.entries({
    Marca:d.marca, Campaña:d.campana, Contacto:d.contacto_nombre, Teléfono:d.telefono,
    Producto:d.producto, Plataformas:Array.isArray(d.plataformas)?d.plataformas.join(', '):d.plataformas,
    'Tipo contenido':d.tipo_contenido, Presupuesto:d.presupuesto?(d.presupuesto+(d.moneda?' '+d.moneda:'')):'', Deadline:d.deadline,
    Creador:d.creador, Instagram:d.instagram, TikTok:d.tiktok, YouTube:d.youtube,
    Seguidores:d.seguidores, Categorías:Array.isArray(d.categorias)?d.categorias.join(', '):d.categorias, Ubicación:d.ubicacion, Tarifa:d.tarifa
  }).filter(([k,v])=>v&&String(v).trim()).map(([k,v])=>`<div class="datos-cell"><div class="k">${k}</div><div class="v">${escHtml(String(v))}</div></div>`).join('');

  document.getElementById('d-body').innerHTML=`
    <div class="detail-row"><span class="k">De</span><span class="v">${escHtml(m.remitente_nombre||'')} &lt;${escHtml(m.remitente_email||'')}&gt;</span></div>
    <div class="detail-row"><span class="k">Recibido</span><span class="v">${fmtDate(m.recibido_en)}</span></div>
    <div class="detail-row"><span class="k">Casilla</span><span class="v">${m.casilla==='contacto'?'contacto@bemeagency.com':'management@bemeagency.com'}</span></div>
    ${m.es_talento_exclusivo?`<div class="detail-row"><span class="k">Talento</span><span class="v" style="color:var(--purple-light);font-weight:700">★ ${escHtml(m.talento_nombre||'Exclusivo')} (representado)</span></div>`:''}
    <div class="section-label">Resumen IA</div>
    <div class="resumen-box">${escHtml(m.resumen||'Sin resumen.')}</div>
    ${datosCells?`<div class="section-label">Datos extraídos</div><div class="datos-grid">${datosCells}</div>`:''}
    ${m.cuerpo_preview?`<div class="section-label">Mensaje original</div><div class="cuerpo-box">${escHtml(m.cuerpo_preview)}</div>`:''}
    <div class="section-label">Respuestas enviadas</div>
    <div id="d-respuestas"><p style="font-size:12.5px;color:var(--text-dim)">Cargando...</p></div>
    <div class="section-label">Responder en el hilo</div>
    <textarea class="form-input" id="d-reply" placeholder="Escribí la respuesta. Se enviará desde ${m.casilla==='contacto'?'contacto@':'management@'} en el mismo hilo, con la firma de BEME."></textarea>
    <div style="display:flex;justify-content:flex-end;margin-top:8px">
      <button class="btn btn-primary btn-sm" id="d-send" onclick="sendReply()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        Enviar respuesta
      </button>
    </div>`;

  // Footer actions
  const acciones=[];
  if(m.casilla==='contacto'||m.tipo==='cotizacion') acciones.push(`<button class="btn btn-outline btn-sm" onclick="crearPresupuesto(${m.id})">＋ Crear presupuesto</button>`);
  if(m.casilla==='management'&&!m.es_talento_exclusivo) acciones.push(`<button class="btn btn-outline btn-sm" onclick="crearTalento(${m.id})">＋ Crear talento</button>`);
  acciones.push(`<button class="btn btn-ghost btn-sm" onclick="setEstado(${m.id},'archivado')">Archivar</button>`);
  if(m.estado!=='gestionado') acciones.push(`<button class="btn btn-success btn-sm" onclick="setEstado(${m.id},'gestionado')">Marcar gestionado</button>`);
  document.getElementById('d-footer').innerHTML=acciones.join('');

  openModal('modal-detalle');
  if(m.estado==='nuevo') setEstado(id,'visto',true);
  loadRespuestas(id);
}

async function loadRespuestas(id){
  const {data}=await sb.from('bandeja_respuestas').select('*').eq('bandeja_id',id).order('enviado_en',{ascending:true});
  const cont=document.getElementById('d-respuestas'); if(!cont) return;
  if(!data||!data.length){ cont.innerHTML=`<p style="font-size:12.5px;color:var(--text-dim)">Todavía no respondiste este mensaje.</p>`; return; }
  cont.innerHTML=data.map(r=>`<div class="reply-item">
    <div class="rmeta"><b>→ ${escHtml(r.to_email||'')}</b><span>${fmtDate(r.enviado_en)}</span>${r.guardado_en_enviados?'<span class="sent-flag">✓ en Enviados</span>':''}</div>
    <div class="rbody">${escHtml(r.cuerpo||'')}</div>
  </div>`).join('');
}

async function sendReply(){
  const m=mails.find(x=>x.id===detailId); if(!m) return;
  const ta=document.getElementById('d-reply'); const body=(ta.value||'').trim();
  if(!body){ showToast('Escribí la respuesta primero.','error'); return; }
  const btn=document.getElementById('d-send'); const prev=btn.innerHTML;
  btn.innerHTML='<span class="spin"></span> Enviando...'; btn.disabled=true;
  try{
    const res=await fetch(`${FN}/reply-email`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bandeja_id:m.id,body})});
    const data=await res.json();
    if(!res.ok||!data.success) throw new Error(data.error||'No se pudo enviar');
    ta.value='';
    showToast(data.savedToSent?'Enviado y guardado en Enviados ✓':'Enviado ✓','success');
    m.estado='gestionado';
    loadRespuestas(m.id); renderStats(); renderList();
  }catch(e){ showToast('Error al enviar: '+e.message,'error'); }
  btn.innerHTML=prev; btn.disabled=false;
}

async function setEstado(id,estado,silent){
  const m=mails.find(x=>x.id===id); if(!m) return;
  const prev=m.estado; m.estado=estado;
  if(!silent) renderAll();
  const {error}=await sb.from('bandeja_emails').update({estado}).eq('id',id);
  if(error){ m.estado=prev; if(!silent){ showToast('No se pudo actualizar: '+error.message,'error'); renderAll(); } return; }
  if(!silent){ showToast(estado==='archivado'?'Archivado':'Marcado como '+estadoLabel(estado).toLowerCase(),'success'); closeModal('modal-detalle'); }
  else renderStats();
}

// ── 1-CLICK: crear presupuesto desde una cotización ──
async function crearPresupuesto(id){
  const m=mails.find(x=>x.id===id); if(!m) return; const d=m.datos||{};
  const monedas=['MXN','USD','ARS','COP','EUR'];
  const prefill={
    titulo:d.campana||d.producto||m.asunto||'',
    marca_nombre:d.marca||m.remitente_nombre||'',
    marca_contacto:d.contacto_nombre||m.remitente_nombre||'',
    marca_email:m.remitente_email||'',
    marca_telefono:d.telefono||'',
    producto:d.producto||d.tipo_contenido||'',
    moneda:monedas.includes((d.moneda||'').toUpperCase())?d.moneda.toUpperCase():'USD',
    notas:[m.resumen,d.presupuesto?('Presupuesto mencionado: '+d.presupuesto+(d.moneda?' '+d.moneda:'')):'',d.deadline?('Deadline: '+d.deadline):'',Array.isArray(d.plataformas)&&d.plataformas.length?('Plataformas: '+d.plataformas.join(', ')):''].filter(Boolean).join('\n')
  };
  try{ localStorage.setItem('beme_presupuesto_prefill',JSON.stringify(prefill)); }catch(e){}
  await sb.from('bandeja_emails').update({estado:'gestionado',link_tipo:'presupuesto'}).eq('id',id);
  location.href='presupuestos.html';
}

// ── 1-CLICK: crear talento desde una propuesta ──
async function crearTalento(id){
  const m=mails.find(x=>x.id===id); if(!m) return; const d=m.datos||{};
  const prefill={
    nombre:d.creador||m.remitente_nombre||'',
    instagram:d.instagram||'', tiktok:d.tiktok||'', youtube:d.youtube||'',
    email:m.remitente_email||'', telefono:d.telefono||'', ciudad:d.ubicacion||'',
    keywords:Array.isArray(d.categorias)?d.categorias.join(', '):(d.categorias||''),
    notas:[m.resumen,d.seguidores?('Seguidores: '+d.seguidores):'',d.tarifa?('Tarifa: '+d.tarifa):'',Array.isArray(d.plataformas)&&d.plataformas.length?('Plataformas: '+d.plataformas.join(', ')):''].filter(Boolean).join('\n')
  };
  try{ localStorage.setItem('beme_talento_prefill',JSON.stringify(prefill)); }catch(e){}
  await sb.from('bandeja_emails').update({estado:'gestionado',link_tipo:'talento'}).eq('id',id);
  location.href='index.html';
}

// ── Sincronizar (dispara la función de ingesta) ──
async function sincronizar(){
  const btn=document.getElementById('sync-btn'); const prev=btn.innerHTML;
  btn.innerHTML='<span class="spin"></span> Sincronizando...'; btn.disabled=true;
  try{
    const res=await fetch(`${FN}/ingest-inbox`);
    const data=await res.json();
    if(!res.ok) throw new Error(data.error||'Error');
    const guardados=(data.results||[]).reduce((a,r)=>a+(r.guardados||0),0);
    await loadData(); renderAll();
    showToast(guardados?`${guardados} mensaje(s) nuevos`:'Bandeja al día','success');
  }catch(e){ showToast('Error al sincronizar: '+e.message,'error'); }
  btn.innerHTML=prev; btn.disabled=false;
}

// ── UTILS ──
function estadoLabel(e){ return {nuevo:'Nuevo',visto:'Visto',gestionado:'Gestionado',archivado:'Archivado'}[e]||e; }
function escHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(s){ if(!s) return '—'; try{ return new Date(s).toLocaleString('es-MX',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(e){ return s; } }
function timeAgo(s){ if(!s) return ''; const diff=(Date.now()-new Date(s).getTime())/1000;
  if(diff<60) return 'ahora'; if(diff<3600) return Math.floor(diff/60)+'m'; if(diff<86400) return Math.floor(diff/3600)+'h';
  if(diff<604800) return Math.floor(diff/86400)+'d'; return new Date(s).toLocaleDateString('es-MX',{day:'2-digit',month:'short'}); }
function openModal(id){ document.getElementById(id)?.classList.add('open'); }
function closeModal(id){ document.getElementById(id)?.classList.remove('open'); }
function showToast(msg,type='info',duration=3200){
  const c=document.getElementById('toast-container');
  const icons={success:'&#10003;',error:'&#10007;',info:'&#8505;'};
  const t=document.createElement('div'); t.className=`toast ${type}`;
  t.innerHTML=`<span>${icons[type]||'&bull;'}</span><span>${escHtml(msg)}</span>`;
  c.appendChild(t); setTimeout(()=>t.remove(),duration);
}
function toggleTheme(){
  isDark=!isDark; document.body.classList.toggle('dark',isDark); document.body.classList.toggle('light',!isDark);
  document.getElementById('theme-icon-dark').style.display=isDark?'none':'block';
  document.getElementById('theme-icon-light').style.display=isDark?'block':'none';
  try{ localStorage.setItem('beme_theme',isDark?'dark':'light'); }catch(e){}
}
(function initTheme(){ let t='light'; try{ t=localStorage.getItem('beme_theme')||'light'; }catch(e){} isDark=(t==='dark'); document.body.classList.add(isDark?'dark':'light');
  const dk=document.getElementById('theme-icon-dark'),lt=document.getElementById('theme-icon-light'); if(dk)dk.style.display=isDark?'none':'block'; if(lt)lt.style.display=isDark?'block':'none'; })();

document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal('modal-detalle'); });
document.querySelectorAll('.modal-overlay').forEach(o=>o.addEventListener('click',e=>{ if(e.target===o) o.classList.remove('open'); }));
setTimeout(()=>{ const lo=document.getElementById('load-overlay'); if(lo&&lo.style.display!=='none') lo.style.display='none'; },15000);
checkAuth();
</script>
</body>
</html>
