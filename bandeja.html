<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beme — Bandeja</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.0/dist/umd/supabase.js"></script>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0f;--surface:#181818;--surface2:#202020;--surface3:#2a2a2a;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.13);
  --primary:#b2005d;--primary-light:#ed568f;--purple:#9414E0;--purple-light:#b557f0;
  --gradient:linear-gradient(135deg,#b2005d 0%,#9414E0 100%);--gradient-h:linear-gradient(135deg,#c8006a 0%,#a718f5 100%);
  --text:#f4f4f4;--text-muted:#7a7a8a;--text-dim:#444455;
  --radius:12px;--radius-sm:8px;--radius-lg:18px;
  --shadow:0 4px 28px rgba(0,0,0,0.55);--shadow-p:0 4px 20px rgba(178,0,93,0.35);
}
body.light{
  --bg:#f4f4f4;--surface:#ffffff;--surface2:#f0f0f0;--surface3:#e8e8e8;
  --border:rgba(0,0,0,0.07);--border2:rgba(0,0,0,0.13);
  --text:#1c1c1c;--text-muted:#5a5a6a;--text-dim:#aaaabd;
  --shadow:0 4px 28px rgba(0,0,0,0.10);--shadow-p:0 4px 20px rgba(178,0,93,0.28);
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:'Syne',sans-serif}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:99px}

.topbar{position:sticky;top:0;z-index:100;background:rgba(15,15,15,0.92);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 24px;height:62px}
body.light .topbar{background:rgba(244,244,244,0.95)}
.logo img{height:44px;width:auto}.logo .logo-dark{display:none}
body.dark .logo .logo-light{display:none}body.dark .logo .logo-dark{display:block}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.theme-toggle{width:36px;height:36px;border-radius:50%;border:1px solid var(--border2);background:var(--surface2);color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.theme-toggle:hover{border-color:var(--primary);color:var(--primary)}
.tab-nav{display:flex;align-items:center;border-bottom:1px solid var(--border);padding:0 24px;background:rgba(15,15,15,0.7);backdrop-filter:blur(10px);position:sticky;top:62px;z-index:99}
body.light .tab-nav{background:rgba(244,244,244,0.9)}
.tab-btn{display:flex;align-items:center;gap:7px;padding:12px 18px;font-size:13px;font-weight:600;color:var(--text-muted);border:none;background:transparent;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-family:inherit}
.tab-btn:hover{color:var(--text)}.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:24px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all 0.18s;font-family:inherit;white-space:nowrap}
.btn-primary{background:var(--gradient);color:#fff;box-shadow:var(--shadow-p)}.btn-primary:hover{background:var(--gradient-h)}
.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--text-muted)}.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-ghost{background:transparent;color:var(--text-muted);padding:7px 12px}.btn-ghost:hover{color:var(--text)}
.btn-success{background:rgba(34,197,94,0.1);color:#4ade80;border:1px solid rgba(34,197,94,0.2)}.btn-success:hover{background:rgba(34,197,94,0.2)}
.btn-sm{padding:6px 12px;font-size:12px}

.main{padding:22px 28px;max-width:1280px;margin:0 auto}
.page-header{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.page-header h1{font-size:24px;font-weight:800;letter-spacing:-0.5px}
.page-header p{font-size:13px;color:var(--text-muted);margin-top:2px}
.page-header-actions{margin-left:auto;display:flex;gap:10px}

/* Tabs por tipo */
.type-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.type-tab{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);font-size:13px;font-weight:700;border-radius:24px;cursor:pointer;font-family:inherit;transition:all 0.18s}
.type-tab:hover{border-color:var(--border2);color:var(--text)}
.type-tab.active{background:var(--gradient);color:#fff;border-color:transparent;box-shadow:var(--shadow-p)}
.type-tab .tcount{font-size:11px;background:rgba(255,255,255,0.18);padding:1px 8px;border-radius:20px}
.type-tab:not(.active) .tcount{background:var(--surface3);color:var(--text-muted)}

.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:340px}
.search-wrap>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-dim)}
.search-input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:24px;padding:8px 14px 8px 36px;font-size:13px;font-family:inherit;outline:none}
.search-input:focus{border-color:var(--primary)}
.filter-select{background:var(--surface2);border:1px solid var(--border);border-radius:24px;padding:8px 14px;font-size:13px;font-family:inherit;color:var(--text);outline:none;cursor:pointer;appearance:none}
.filter-select:focus{border-color:var(--primary)}

/* Lista de hilos */
.thread-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px}
.thread-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;cursor:pointer;transition:all 0.2s;position:relative;overflow:hidden}
.thread-card::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;background:var(--gradient);opacity:0;transition:opacity 0.2s}
.thread-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:var(--shadow)}
.thread-card:hover::before{opacity:1}.thread-card.nuevo::before{opacity:1}
.tc-head{display:flex;align-items:flex-start;gap:11px;margin-bottom:9px}
.tc-avatar{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:linear-gradient(135deg,rgba(178,0,93,0.15),rgba(148,20,224,0.15));color:var(--primary-light);font-weight:800;font-size:14px;border:1px solid rgba(178,0,93,0.2)}
.tc-meta{flex:1;min-width:0}
.tc-name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-sub{font-size:12.5px;color:var(--text);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-date{font-size:11px;color:var(--text-dim);flex-shrink:0;white-space:nowrap}
.tc-snippet{font-size:12px;color:var(--text-muted);line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tc-snippet .dir{font-weight:700;color:var(--text-dim)}
.tc-foot{display:flex;align-items:center;gap:6px;margin-top:11px;padding-top:11px;border-top:1px solid var(--border);flex-wrap:wrap}
.badge{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}
.b-tag{background:rgba(178,0,93,0.1);color:var(--primary-light)}
.b-pend{background:rgba(245,158,11,0.14);color:#f59e0b}
.b-resp{background:rgba(34,197,94,0.12);color:#4ade80}
.b-nuevo{background:var(--gradient);color:#fff}
.b-excl{background:linear-gradient(135deg,rgba(148,20,224,0.18),rgba(178,0,93,0.18));color:var(--purple-light);border:1px solid rgba(148,20,224,0.25);display:inline-flex;align-items:center;gap:3px}
.chip{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--surface2);color:var(--text-muted);border:1px solid var(--border)}
.tc-count{margin-left:auto;font-size:11px;color:var(--text-dim)}

.empty-state{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text-muted)}
.empty-state svg{opacity:0.2;margin-bottom:16px}.empty-state h3{font-size:16px;color:var(--text);margin-bottom:6px}.empty-state p{font-size:13px}

/* Modal */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.8);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity 0.2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);width:100%;max-width:680px;max-height:92vh;display:flex;flex-direction:column;transform:scale(0.95);transition:transform 0.2s}
.modal-overlay.open .modal{transform:scale(1)}
.modal-header{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.modal-title{font-size:16px;font-weight:700;line-height:1.3}
.modal-sub{font-size:12px;color:var(--text-muted);margin-top:3px}
.modal-close{width:32px;height:32px;border-radius:50%;border:none;background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-muted);flex-shrink:0}
.modal-close:hover{background:var(--surface3);color:var(--text)}
.modal-body{padding:18px 22px;overflow-y:auto;flex:1}
.modal-footer{padding:12px 22px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--border)}

/* Conversación (chat) */
.convo{display:flex;flex-direction:column;gap:12px}
.bubble{max-width:86%;border-radius:14px;padding:11px 13px;position:relative}
.bubble .bmeta{font-size:10.5px;color:var(--text-dim);margin-bottom:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bubble .bbody{font-size:12.5px;line-height:1.5;white-space:pre-wrap;color:var(--text)}
.bubble.recibido{align-self:flex-start;background:var(--surface2);border:1px solid var(--border);border-bottom-left-radius:4px}
.bubble.enviado{align-self:flex-end;background:linear-gradient(135deg,rgba(178,0,93,0.12),rgba(148,20,224,0.12));border:1px solid rgba(178,0,93,0.2);border-bottom-right-radius:4px}
.dir-pill{font-size:9.5px;font-weight:700;padding:1px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:0.5px}
.dir-pill.r{background:rgba(120,120,140,0.18);color:var(--text-muted)}
.dir-pill.e{background:rgba(178,0,93,0.18);color:var(--primary-light)}
.bubble .resumen{font-size:11.5px;color:var(--primary-light);background:rgba(178,0,93,0.06);border-radius:6px;padding:6px 8px;margin-top:7px;line-height:1.45}
.sent-flag{font-size:10px;font-weight:700;color:#4ade80}
.section-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim);margin:16px 0 8px}
.datos-chips{display:flex;flex-wrap:wrap;gap:6px}
.datos-chips .chip.k{background:rgba(178,0,93,0.08);color:var(--primary-light);border-color:rgba(178,0,93,0.18)}
.form-input{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:10px 12px;font-size:13.5px;font-family:inherit;outline:none;width:100%}
.form-input:focus{border-color:var(--primary)}
textarea.form-input{resize:vertical;min-height:84px}

.toast-container{position:fixed;top:76px;right:20px;z-index:999;display:flex;flex-direction:column;gap:6px}
.toast{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:11px 14px;font-size:13px;color:var(--text);box-shadow:var(--shadow);min-width:230px;animation:slideIn 0.3s ease;display:flex;gap:8px}
.toast.success{border-left:3px solid #4ade80}.toast.error{border-left:3px solid #ff6b6b}.toast.info{border-left:3px solid var(--primary)}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
#load-overlay{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.loader-logo img{height:56px}.loader-bar{width:200px;height:3px;background:var(--surface3);border-radius:99px;overflow:hidden}
.loader-fill{height:100%;width:0;background:var(--gradient);border-radius:99px;animation:loaderAnim 1.4s ease-in-out infinite}
@keyframes loaderAnim{0%{width:0;margin-left:0}50%{width:60%;margin-left:20%}100%{width:0;margin-left:100%}}
#login-overlay{position:fixed;inset:0;background:rgba(15,15,15,0.97);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;z-index:9999}
body.light #login-overlay{background:rgba(244,244,244,0.97)}
.login-card{background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius-lg);padding:40px;width:100%;max-width:380px;box-shadow:var(--shadow)}
.login-logo{text-align:center;margin-bottom:28px}.login-logo img{height:48px;margin-bottom:4px}.login-logo p{font-size:13px;color:var(--text-muted);margin-top:8px}
.login-error{display:none;background:rgba(220,50,50,0.1);border:1px solid rgba(220,50,50,0.2);border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;color:#ff6b6b;margin-bottom:14px}
.login-fields{display:flex;flex-direction:column;gap:10px}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,0.35);border-top-color:#fff;border-radius:50%;animation:rot 0.7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media(max-width:900px){.thread-grid{grid-template-columns:1fr}}
@media(max-width:768px){.main{padding:16px}.topbar{padding:0 12px}.tab-nav{overflow-x:auto;padding:0 12px}}
</style>
</head>
<body>

<div id="load-overlay">
  <div class="loader-logo"><img src="assets/brand/logos/Beme1Color.png" alt="Beme"></div>
  <div class="loader-bar"><div class="loader-fill"></div></div>
  <p style="font-size:12px;color:var(--text-dim);margin-top:8px" id="load-msg">Conectando...</p>
</div>
<div id="login-overlay" style="display:none">
  <div class="login-card">
    <div class="login-logo"><img src="assets/brand/logos/Beme1Color.png" alt="Beme" style="height:48px"><p>Bandeja</p></div>

      <input type="email" id="login-email" class="form-input" placeholder="Email">
      <input type="password" id="login-pass" class="form-input" placeholder="Contraseña" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:6px" id="login-btn" onclick="doLogin()">Ingresar</button>
    </div>
  </div>
</div>
<div class="toast-container" id="toast-container"></div>

<header class="topbar">
  <a href="index.html" class="logo"><img src="assets/brand/logos/Beme1Color.png" alt="Beme" class="logo-light"><img src="assets/brand/logos/Beme1blanco.png" alt="Beme" class="logo-dark"></a>
  <div class="topbar-right">
    <button class="theme-toggle" onclick="toggleTheme()" title="Tema">
      <svg id="theme-icon-dark" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      <svg id="theme-icon-light" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <button class="theme-toggle" onclick="doLogout()" title="Salir"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
  </div>
</header>

<nav class="tab-nav">

<script>
const SUPABASE_URL='https://ngstqwbzvnpggpklifat.supabase.co';
const SUPABASE_KEY='sb_publishable_1E2K-9D-KzOSVCgROnfa-g_-WCnWCDb';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const FN='/.netlify/functions';
const TAGS=[
  {key:'cotizacion',label:'Cotizaciones'},
  {key:'propuesta',label:'Propuestas'},
  {key:'finanzas',label:'Finanzas'},
  {key:'logistica',label:'Logística'},
  {key:'spam',label:'Spam'},
];
const TAGLABEL={cotizacion:'Cotización',propuesta:'Propuesta',finanzas:'Finanzas',logistica:'Logística',spam:'Spam'};

let currentUser=null, mensajes=[], threads=[], currentTag='cotizacion', isDark=false, openThreadKey=null;

// AUTH
async function doLogin(){
  const email=(document.getElementById('login-email').value||'').trim();
  const pass=document.getElementById('login-pass').value||'';
  const btn=document.getElementById('login-btn');
  if(!email||!pass){ showLoginErr('Completá email y contraseña.'); return; }
  btn.textContent='Ingresando...'; btn.disabled=true;
  try{ const {data,error}=await sb.auth.signInWithPassword({email,password:pass}); if(error)showLoginErr(error.message); else{currentUser=data.user; await initApp();} }
  catch(e){ showLoginErr('Error: '+e.message); }
  btn.textContent='Ingresar'; btn.disabled=false;
}
function showLoginErr(m){ const d=document.getElementById('login-error'); d.textContent=m; d.style.display='block'; }
async function checkAuth(){ const {data:{session}}=await sb.auth.getSession(); if(session){currentUser=session.user; await initApp();} else{ document.getElementById('load-overlay').style.display='none'; document.getElementById('login-overlay').style.display='flex'; } }
async function doLogout(){ await sb.auth.signOut(); location.reload(); }

async function initApp(){
  document.getElementById('load-msg').textContent='Cargando conversaciones...';
  try{
    const {data:profile}=await sb.from('user_profiles').select('*').eq('id',currentUser.id).single();
    if(!profile){ document.getElementById('login-overlay').style.display='flex'; showLoginErr('Tu usuario no tiene perfil.'); document.getElementById('load-overlay').style.display='none'; return; }
    if(profile.role==='talent'){ location.href='talento-portal.html'; return; }
    await loadData();
    document.getElementById('login-overlay').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('load-overlay').style.display='none';
    renderAll();
  }catch(e){ console.error(e); showToast('Error al cargar: '+e.message,'error'); document.getElementById('load-overlay').style.display='none'; }
}

async function loadData(){
  const {data,error}=await sb.from('bandeja_mensajes').select('*').order('fecha',{ascending:false}).limit(1000);
  if(error) throw error;
  mensajes=data||[];
  buildThreads();
}

function buildThreads(){
  const map=new Map();
  for(const m of mensajes){ const k=m.thread_key||m.message_id; if(!map.has(k))map.set(k,[]); map.get(k).push(m); }
  threads=[];
  for(const [k,msgs] of map){
    msgs.sort((a,b)=>new Date(a.fecha||0)-new Date(b.fecha||0));
    const recibidos=msgs.filter(m=>m.direccion==='recibido');
    const last=msgs[msgs.length-1];
    let tag=''; for(let i=recibidos.length-1;i>=0;i--){ if(recibidos[i].tag){tag=recibidos[i].tag;break;} }
    if(!tag) tag = msgs[0].casilla==='contacto'?'cotizacion':'propuesta';
    const tMsg=msgs.find(m=>m.talento_nombre)||{};
    const baseMsg=recibidos[0]||msgs[0];
    threads.push({
      key:k, msgs, last,
      tag, casilla:msgs[0].casilla,
      talento_id:tMsg.talento_id||null, talento_nombre:tMsg.talento_nombre||'',
      es_excl:msgs.some(m=>m.es_talento_exclusivo),
      de_nombre:baseMsg.de_nombre, de_email:baseMsg.de_email,
      hasNuevo:recibidos.some(m=>m.estado==='nuevo'),
      archivado:msgs.length>0 && msgs.every(m=>m.estado==='archivado'),
      asunto:(baseMsg.asunto||last.asunto||'').replace(/^((re|fwd|rv|fw)\s*:\s*)+/i,'').trim(),
      lastDir:last.direccion, fecha:last.fecha,
      lastRecibidoId:recibidos.length?recibidos[recibidos.length-1].id:msgs[msgs.length-1].id,
    });
  }
  threads.sort((a,b)=>new Date(b.fecha||0)-new Date(a.fecha||0));
}

function renderAll(){ renderTabs(); renderTalentoFilter(); renderThreads(); renderSubtitle(); }
function renderSubtitle(){
  const nuevos=threads.filter(t=>t.hasNuevo).length;
  const pend=threads.filter(t=>!t.archivado&&t.lastDir==='recibido').length;
  document.getElementById('subtitle-count').textContent=`${threads.length} conversaciones · ${pend} sin responder · ${nuevos} nuevas`;
}
function renderTabs(){
  document.getElementById('type-tabs').innerHTML=TAGS.map(t=>{
    const n=threads.filter(x=>x.tag===t.key&&!x.archivado).length;
    return `<button class="type-tab ${t.key===currentTag?'active':''}" onclick="setTag('${t.key}')">${t.label}<span class="tcount">${n}</span></button>`;
  }).join('');
}
function setTag(k){ currentTag=k; renderTabs(); renderThreads(); }
function renderTalentoFilter(){
  const sel=document.getElementById('filter-talento'); const cur=sel.value;
  const seen=new Map();
  threads.forEach(t=>{ if(t.talento_id&&!seen.has(t.talento_id)) seen.set(t.talento_id,t.talento_nombre); });
  sel.innerHTML='<option value="">Todos los talentos</option>'+[...seen].map(([id,nom])=>`<option value="${id}">${escHtml(nom)}</option>`).join('');
  sel.value=cur;
}

function renderThreads(){
  const q=(document.getElementById('search-input').value||'').toLowerCase().trim();
  const fEstado=document.getElementById('filter-estado').value;
  const fCasilla=document.getElementById('filter-casilla').value;
  const fTalento=document.getElementById('filter-talento').value;
  let list=threads.filter(t=>t.tag===currentTag);
  if(fEstado==='archivado') list=list.filter(t=>t.archivado);
  else list=list.filter(t=>!t.archivado);
  if(fEstado==='sin_responder') list=list.filter(t=>t.lastDir==='recibido');
  if(fEstado==='respondido') list=list.filter(t=>t.lastDir==='enviado');
  if(fEstado==='nuevo') list=list.filter(t=>t.hasNuevo);
  if(fCasilla) list=list.filter(t=>t.casilla===fCasilla);
  if(fTalento) list=list.filter(t=>String(t.talento_id)===fTalento);
  if(q) list=list.filter(t=>[t.talento_nombre,t.de_nombre,t.de_email,t.asunto,t.last.cuerpo_preview,t.last.resumen].join(' ').toLowerCase().includes(q));
  const c=document.getElementById('threads');
  if(!list.length){
    c.innerHTML=`<div class="empty-state"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><h3>Nada en ${TAGLABEL[currentTag]}</h3><p>No hay conversaciones con este filtro.<br>Probá <b>Sincronizar</b> o cambiá los filtros.</p></div>`;
    return;
  }
  c.innerHTML=list.map(threadCard).join('');
}

function threadCard(t){
  const title=t.es_excl&&t.talento_nombre?t.talento_nombre:(t.de_nombre||t.de_email||'Sin remitente');
  const initials=(title||'?').trim().slice(0,2).toUpperCase();
  const dirIcon=t.last.direccion==='enviado'?'↑ Vos':'↓';
  const snippet=(t.last.resumen||t.last.cuerpo_preview||'').slice(0,160);
  const pend=t.lastDir==='recibido'?`<span class="badge b-pend">Sin responder</span>`:`<span class="badge b-resp">Respondido</span>`;
  const nuevo=t.hasNuevo?`<span class="badge b-nuevo">Nuevo</span>`:'';
  const excl=t.es_excl?`<span class="badge b-excl">★ exclusivo</span>`:'';
  return `<div class="thread-card ${t.hasNuevo?'nuevo':''}" onclick="openThread('${cssEsc(t.key)}')">
    <div class="tc-head">
      <div class="tc-avatar">${escHtml(initials)}</div>
      <div class="tc-meta">
        <div class="tc-name">${escHtml(title)}</div>
        <div class="tc-sub">${escHtml(t.asunto||'(sin asunto)')}</div>
      </div>
      <div class="tc-date">${timeAgo(t.fecha)}</div>
    </div>
    <div class="tc-snippet"><span class="dir">${dirIcon}</span> ${escHtml(snippet)||'—'}</div>
    <div class="tc-foot">
      <span class="badge b-tag">${TAGLABEL[t.tag]||t.tag}</span>
      ${nuevo}${pend}${excl}
      <span class="chip">${t.casilla==='contacto'?'contacto@':'management@'}</span>
      <span class="tc-count">${t.msgs.length} msj</span>
    </div>
  </div>`;
}

// THREAD DETAIL
function openThread(key){
  const t=threads.find(x=>x.key===key); if(!t) return;
  openThreadKey=key;
  document.getElementById('t-title').textContent=(t.es_excl&&t.talento_nombre?('★ '+t.talento_nombre):(t.de_nombre||t.de_email))+' — '+(t.asunto||'(sin asunto)');
  document.getElementById('t-sub').textContent=`${t.casilla==='contacto'?'contacto@':'management@'} · ${t.de_email||''} · ${t.msgs.length} mensajes`;

  const bubbles=t.msgs.map(m=>{
    const d=m.datos||{};
    const chips=Object.entries({Precio:d.precio?(d.precio+(d.moneda?' '+d.moneda:'')):'',Campaña:d.campana,Plataformas:Array.isArray(d.plataformas)?d.plataformas.join(', '):d.plataformas,Deadline:d.deadline,Monto:d.monto,Tel:d.telefono})
      .filter(([k,v])=>v&&String(v).trim()).map(([k,v])=>`<span class="chip k">${k}: ${escHtml(String(v))}</span>`).join('');
    const dir=m.direccion;
    return `<div class="bubble ${dir}">
      <div class="bmeta">
        <span class="dir-pill ${dir==='enviado'?'e':'r'}">${dir==='enviado'?'Enviado':'Recibido'}</span>
        <span>${dir==='enviado'?'BEME → '+escHtml(m.para_email||''):escHtml(m.de_nombre||m.de_email||'')}</span>
        <span>${fmtDate(m.fecha)}</span>
        ${dir==='enviado'?'<span class="sent-flag">✓ en Enviados</span>':''}
      </div>
      <div class="bbody">${escHtml((m.cuerpo_preview||'').slice(0,1400))||'<sin cuerpo>'}</div>
      ${m.resumen?`<div class="resumen">📝 ${escHtml(m.resumen)}</div>`:''}
      ${chips?`<div class="datos-chips" style="margin-top:7px">${chips}</div>`:''}
    </div>`;
  }).join('');

  document.getElementById('t-body').innerHTML=`
    <div class="convo">${bubbles}</div>
    <div class="section-label">Responder en el hilo</div>
    <textarea class="form-input" id="t-reply" placeholder="Respuesta desde ${t.casilla==='contacto'?'contacto@':'management@'}, en este hilo, con la firma de BEME."></textarea>
    <div style="display:flex;justify-content:flex-end;margin-top:8px">
      <button class="btn btn-primary btn-sm" id="t-send" onclick="sendReply()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Enviar</button>
    </div>`;

  const tagSel=`<select class="filter-select" id="t-tag" onchange="cambiarTag('${cssEsc(key)}',this.value)" title="Etiqueta">${TAGS.map(tg=>`<option value="${tg.key}" ${tg.key===t.tag?'selected':''}>${tg.label}</option>`).join('')}</select>`;
  const acc=[tagSel];
  if(t.tag==='cotizacion') acc.push(`<button class="btn btn-outline btn-sm" onclick="crearPresupuesto('${cssEsc(key)}')">＋ Presupuesto</button>`);
  acc.push(`<button class="btn btn-ghost btn-sm" onclick="archivar('${cssEsc(key)}')">Archivar</button>`);
  document.getElementById('t-footer').innerHTML=acc.join('');

  openModal('modal-thread');
  if(t.hasNuevo) marcarVisto(t);
}

async function sendReply(){
  const t=threads.find(x=>x.key===openThreadKey); if(!t) return;
  const ta=document.getElementById('t-reply'); const body=(ta.value||'').trim();
  if(!body){ showToast('Escribí la respuesta primero.','error'); return; }
  const btn=document.getElementById('t-send'); const prev=btn.innerHTML; btn.innerHTML='<span class="spin"></span> Enviando...'; btn.disabled=true;
  try{
    const res=await fetch(`${FN}/reply-email`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mensaje_id:t.lastRecibidoId,body})});
    const data=await res.json();
    if(!res.ok||!data.success) throw new Error(data.error||'No se pudo enviar');
    showToast(data.savedToSent?'Enviado y guardado en Enviados ✓':'Enviado ✓','success');
    await loadData(); renderAll(); openThread(openThreadKey);
  }catch(e){ showToast('Error: '+e.message,'error'); btn.innerHTML=prev; btn.disabled=false; }
}

async function cambiarTag(key,nuevo){
  const t=threads.find(x=>x.key===key); if(!t) return;
  const target=t.msgs.filter(m=>m.direccion==='recibido').slice(-1)[0]||t.msgs.slice(-1)[0];
  const {error}=await sb.from('bandeja_mensajes').update({tag:nuevo}).eq('id',target.id);
  if(error){ showToast('No se pudo reetiquetar: '+error.message,'error'); return; }
  target.tag=nuevo; buildThreads(); renderAll();
  showToast('Etiqueta cambiada a '+(TAGLABEL[nuevo]||nuevo),'success');
  currentTag=nuevo; renderTabs(); renderThreads();
  closeModal('modal-thread');
}

async function marcarVisto(t){
  const ids=t.msgs.filter(m=>m.direccion==='recibido'&&m.estado==='nuevo').map(m=>m.id);
  if(!ids.length) return;
  ids.forEach(id=>{ const m=mensajes.find(x=>x.id===id); if(m)m.estado='visto'; });
  buildThreads(); renderTabs(); renderSubtitle();
  await sb.from('bandeja_mensajes').update({estado:'visto'}).in('id',ids);
}

async function archivar(key){
  const t=threads.find(x=>x.key===key); if(!t) return;
  const ids=t.msgs.map(m=>m.id);
  ids.forEach(id=>{ const m=mensajes.find(x=>x.id===id); if(m)m.estado='archivado'; });
  buildThreads(); renderAll(); closeModal('modal-thread');
  const {error}=await sb.from('bandeja_mensajes').update({estado:'archivado'}).in('id',ids);
  showToast(error?('Error: '+error.message):'Conversación archivada','success');
}

async function crearPresupuesto(key){
  const t=threads.find(x=>x.key===key); if(!t) return;
  const rec=t.msgs.filter(m=>m.direccion==='recibido').slice(-1)[0]||{}; const d=rec.datos||{};
  const precio=parseFloat(String(d.precio||'').replace(/[^0-9.]/g,''))||0;
  const monedas=['MXN','USD','ARS','COP','EUR'];
  const prefill={
    titulo:d.campana||t.asunto||'', marca_nombre:'',
    moneda:monedas.includes((d.moneda||'').toUpperCase())?d.moneda.toUpperCase():'USD',
    notas:[rec.resumen,'Cotización de '+(t.talento_nombre||t.de_nombre||'talento')].filter(Boolean).join('\n'),
    _items:[{talento_id:t.talento_id||null,talento_nombre:t.talento_nombre||t.de_nombre||'',contenido:d.tipo_contenido||'',precio}]
  };
  try{ localStorage.setItem('beme_presupuesto_prefill',JSON.stringify(prefill)); }catch(e){}
  location.href='presupuestos.html';
}

async function sincronizar(){
  const btn=document.getElementById('sync-btn'); const prev=btn.innerHTML; btn.innerHTML='<span class="spin"></span> Sincronizando...'; btn.disabled=true;
  try{
    const res=await fetch(`${FN}/ingest-inbox?days=14&max=10`);
    const txt=await res.text();
    let data=null; try{ data=JSON.parse(txt); }catch(_){}
    if(!res.ok) throw new Error((data&&data.error)||`HTTP ${res.status}: ${(txt||'').slice(0,120)}`);
    if(!data) throw new Error('Respuesta vacía (posible timeout). Reintentá, va trayendo de a poco.');
    await loadData(); renderAll();
    if(data.diferidos) showToast(`${data.guardados||0} nuevos · quedan ${data.diferidos} para la próxima — apretá Sincronizar de nuevo`,'info',5000);
    else showToast(data.guardados?`${data.guardados} mensaje(s) nuevos`:'Bandeja al día','success');
  }catch(e){ showToast('Error al sincronizar: '+e.message,'error',5000); }
  btn.innerHTML=prev; btn.disabled=false;
}

// UTILS
function escHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function cssEsc(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function fmtDate(s){ if(!s)return '—'; try{ return new Date(s).toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }catch(e){ return s; } }
function timeAgo(s){ if(!s)return ''; const d=(Date.now()-new Date(s).getTime())/1000; if(d<60)return'ahora'; if(d<3600)return Math.floor(d/60)+'m'; if(d<86400)return Math.floor(d/3600)+'h'; if(d<604800)return Math.floor(d/86400)+'d'; return new Date(s).toLocaleDateString('es-MX',{day:'2-digit',month:'short'}); }
function openModal(id){ document.getElementById(id)?.classList.add('open'); }
function closeModal(id){ document.getElementById(id)?.classList.remove('open'); }
function showToast(msg,type='info',dur=3200){ const c=document.getElementById('toast-container'); const ic={success:'&#10003;',error:'&#10007;',info:'&#8505;'}; const t=document.createElement('div'); t.className=`toast ${type}`; t.innerHTML=`<span>${ic[type]||'&bull;'}</span><span>${escHtml(msg)}</span>`; c.appendChild(t); setTimeout(()=>t.remove(),dur); }
function toggleTheme(){ isDark=!isDark; document.body.classList.toggle('dark',isDark); document.body.classList.toggle('light',!isDark); document.getElementById('theme-icon-dark').style.display=isDark?'none':'block'; document.getElementById('theme-icon-light').style.display=isDark?'block':'none'; try{localStorage.setItem('beme_theme',isDark?'dark':'light');}catch(e){} }
(function(){ let th='light'; try{th=localStorage.getItem('beme_theme')||'light';}catch(e){} isDark=(th==='dark'); document.body.classList.add(isDark?'dark':'light'); const dk=document.getElementById('theme-icon-dark'),lt=document.getElementById('theme-icon-light'); if(dk)dk.style.display=isDark?'none':'block'; if(lt)lt.style.display=isDark?'block':'none'; })();
document.addEventListener('keydown',e=>{ if(e.key==='Escape')closeModal('modal-thread'); });
document.querySelectorAll('.modal-overlay').forEach(o=>o.addEventListener('click',e=>{ if(e.target===o)o.classList.remove('open'); }));
setTimeout(()=>{ const lo=document.getElementById('load-overlay'); if(lo&&lo.style.display!=='none')lo.style.display='none'; },15000);
checkAuth();
</script>
</body>
