<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roster — Beme</title>
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.0/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#f4f2f8;color:#111;min-height:100vh;padding-bottom:130px;}
.page{background:#fff;max-width:1200px;margin:28px auto;border-radius:16px;padding:36px;box-shadow:0 4px 32px rgba(0,0,0,0.07);}
a{text-decoration:none;}
textarea,input{font-family:'Plus Jakarta Sans',sans-serif;}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{display:none;}
input[type=number]{-moz-appearance:textfield;}

#loading-screen{position:fixed;inset:0;background:#f4f2f8;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px;}
.loader-logo img{height:56px;width:auto;}
.loader-spinner{width:36px;height:36px;border:3px solid rgba(178,0,93,0.2);border-top-color:#b2005d;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{font-size:14px;color:#888;}

.desktop-view{display:block;}
.mobile-view{display:none;}

#summary-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:linear-gradient(135deg,#8a0048,#6a0d9e);
  color:#fff;padding:14px 24px;
  display:flex;align-items:flex-start;gap:20px;
  box-shadow:0 -4px 24px rgba(0,0,0,0.22);
  transition:all 0.3s;opacity:0;transform:translateY(100%);
  z-index:9999;flex-wrap:wrap;
}
#export-btn{
  background:rgba(255,255,255,0.18);border:1.5px solid rgba(255,255,255,0.5);
  color:#fff;padding:10px 18px;border-radius:24px;cursor:pointer;
  font-size:13px;font-weight:700;font-family:inherit;white-space:nowrap;
  flex-shrink:0;align-self:center;transition:background 0.15s;
}
#export-btn:hover{background:rgba(255,255,255,0.28);}

.save-badge{
  position:fixed;top:16px;right:16px;z-index:500;
  background:#1D9E75;color:#fff;font-size:12px;font-weight:700;
  padding:6px 14px;border-radius:20px;opacity:0;transition:opacity 0.3s;
  box-shadow:0 2px 8px rgba(0,0,0,0.15);
}
.save-badge.show{opacity:1;}

@media(max-width:768px){
  body{padding-bottom:150px;}
  .page{margin:0;border-radius:0;padding:16px;}
  .desktop-view{display:none;}
  .mobile-view{display:block;}
  #summary-bar{padding:12px 16px;gap:12px;}
  #export-btn{padding:8px 14px;font-size:12px;}
}
@media(max-width:480px){
  .page{padding:12px;}
  #summary-bar{flex-direction:column;gap:10px;padding:10px 14px;}
  #export-btn{width:100%;text-align:center;}
}
@media print{
  body{background:#fff;padding:0;}
  .page{box-shadow:none;margin:0;border-radius:0;padding:20px;}
  .mobile-view{display:none!important;}
  .desktop-view{display:block!important;}
  #summary-bar,#loading-screen,.save-badge{display:none!important;}
  @page{margin:12mm;size:A4 landscape;}
}
</style>
</head>
<body>

<div id="loading-screen">
  <div class="loader-logo"><img src="assets/brand/logos/Beme1Color.png" alt="Beme"></div>
  <div class="loader-spinner"></div>
  <div class="loader-text" id="load-msg">Cargando roster...</div>
</div>

<div class="save-badge" id="save-badge">✓ Guardado</div>

<div id="app" style="display:none">
  <div class="page" id="page-content"></div>
</div>

<div id="summary-bar">
  <div style="min-width:160px;flex-shrink:0;">
    <div id="sum-count" style="font-weight:800;font-size:15px;"></div>
    <div id="sum-total-wrap" style="display:none;align-items:baseline;gap:5px;margin-top:3px;">
      <span style="font-size:12px;opacity:0.75;">Total:</span>
      <span id="sum-total" style="font-size:19px;font-weight:800;"></span>
    </div>
  </div>
  <div id="sum-list" style="flex:1;min-width:180px;max-height:100px;overflow-y:auto;font-size:12px;"></div>
  <button id="remove-selected-btn" onclick="removeSelectedFromRoster()" style="display:none;padding:10px 18px;border-radius:24px;border:1px solid rgba(255,100,100,0.5);background:rgba(255,60,60,0.15);color:#ff6b6b;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap">🗑 Eliminar del Roster</button>
  <button id="hide-selected-btn" onclick="bulkHideSelected()" style="display:none;padding:10px 18px;border-radius:24px;border:1px solid rgba(239,68,68,0.4);background:rgba(239,68,68,0.1);color:#ef4444;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap">Descartar seleccionados</button>
  <button id="export-btn">↓ Exportar CSV</button>
</div>

<div id="price-hist-modal" style="display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;padding:20px;">
  <div style="background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 12px 48px rgba(0,0,0,0.25);">
    <div style="padding:16px 20px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;gap:10px;">
      <div style="font-weight:800;font-size:15px;color:#111;" id="ph-title">Historial de precios</div>
      <button onclick="closePriceHistory()" style="background:none;border:none;font-size:24px;line-height:1;color:#888;cursor:pointer;">×</button>
    </div>
    <div id="ph-body" style="padding:14px 20px 20px;overflow-y:auto;"></div>
  </div>
</div>

<div id="valores-modal" style="display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;padding:20px;">
  <div style="background:#fff;border-radius:14px;max-width:520px;width:100%;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 12px 48px rgba(0,0,0,0.25);">
    <div style="padding:16px 20px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;gap:10px;">
      <div style="font-weight:800;font-size:15px;color:#111;" id="val-title">Valores de contenido</div>
      <button onclick="closeValores()" style="background:none;border:none;font-size:24px;line-height:1;color:#888;cursor:pointer;">×</button>
    </div>
    <div id="val-body" style="padding:16px 20px 22px;overflow-y:auto;font-size:13px;color:#333;line-height:1.6;white-space:pre-wrap;"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://ngstqwbzvnpggpklifat.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1E2K-9D-KzOSVCgROnfa-g_-WCnWCDb';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const FLAG_MAP = {"Argentina":"🇦🇷","Bolivia":"🇧🇴","Brasil":"🇧🇷","Chile":"🇨🇱","Colombia":"🇨🇴","Costa Rica":"🇨🇷","Cuba":"🇨🇺","Ecuador":"🇪🇨","El Salvador":"🇸🇻","España":"🇪🇸","Estados Unidos":"🇺🇸","Guatemala":"🇬🇹","Honduras":"🇭🇳","México":"🇲🇽","Nicaragua":"🇳🇮","Panamá":"🇵🇦","Paraguay":"🇵🇾","Perú":"🇵🇪","Puerto Rico":"🇵🇷","República Dominicana":"🇩🇴","Uruguay":"🇺🇾","Venezuela":"🇻🇪"};

let ROSTER = null;
let TALENTS = [];
let SELS = {}; // talent_id → {selected, lineas:[{accion,precio}], contraoferta(=comentarios), admin_precio, admin_notes, hidden}
let LINK_ID = 0; // 0 = legacy direct token, >0 = roster_links.id
let CLIENT_NAME = '';
var COMPACT_MODE = new URLSearchParams(window.location.search).get('compact') === '1';
// Persist view/sort preferences per roster in localStorage
function _rosterPrefKey() { return 'roster_prefs_' + (new URLSearchParams(window.location.search).get('link') || new URLSearchParams(window.location.search).get('token') || ''); }
function _loadRosterPrefs() { try { return JSON.parse(localStorage.getItem(_rosterPrefKey())) || {}; } catch(e) { return {}; } }
function _saveRosterPrefs(prefs) { try { localStorage.setItem(_rosterPrefKey(), JSON.stringify(prefs)); } catch(e) {} }
var _prefs = _loadRosterPrefs();
let rosterViewMode = _prefs.view || 'table';
let rosterSort = _prefs.sort || 'ig-desc';
let showAI = null; // null = use ROSTER.show_ai_descriptions
let IS_INTERNAL = false; // admin or campaign_manager
let DISPLAY_TITLE = '';

// ── Helpers ──────────────────────────────────────────────────
function fmtF(n){if(!n||n===0)return'—';if(n>=1e6)return(n/1e6).toFixed(1).replace('.0','')+'M';if(n>=1000)return Math.floor(n/1000)+'K';return String(n);}
function ini(name){return name.split(' ').slice(0,2).map(w=>w[0]).join('').toUpperCase();}
function extractH(url){if(!url)return'';const m=url.match(/@([^/?#&]+)/);if(m)return'@'+m[1];let u=url.replace(/https?:\/\/(www\.)?(tiktok\.com|instagram\.com|youtube\.com)\/?/i,'').split(/[/?#&]/)[0];u=u.replace(/^@/,'');return u?'@'+u:url;}
function countries(t){return(t.paises||[t.pais||'']).filter(Boolean).map(c=>(FLAG_MAP[c]||'')+' '+c);}
function escHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function escAttr(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function monedaSymbol(cur){return ({USD:'US$',MXN:'MX$',ARS:'AR$',EUR:'€'})[cur] || '$';}
function fmtPrecio(p, cur){return monedaSymbol(cur || (ROSTER && ROSTER.moneda))+' '+Number(p).toLocaleString('es-ES');}

// ── Líneas acción→precio ──────────────────────────────────────
// Devuelve las líneas {accion, precio} de un talento: propias, o sembradas
// desde las acciones comunes del roster, o fallback legacy a accion/precio.
function getLineas(tid){
  const sel = SELS[tid];
  if (sel && Array.isArray(sel.lineas) && sel.lineas.length) return sel.lineas;
  if (sel && (sel.accion || sel.precio != null)) return [{accion: sel.accion||'', precio: sel.precio}];
  if (Array.isArray(ROSTER.lineas_comunes) && ROSTER.lineas_comunes.length) {
    return ROSTER.lineas_comunes.map(l => ({accion: l.accion||'', precio: null}));
  }
  return [{accion:'', precio:null}];
}
// Lee las líneas actuales desde el DOM (admin). Maneja vistas duplicadas (desktop+móvil) por data-idx.
function collectLineas(id){
  const byIdx = {};
  document.querySelectorAll(`.linea-accion[data-id="${id}"]`).forEach(el=>{ const i=el.getAttribute('data-idx'); if(byIdx[i]===undefined)byIdx[i]={}; if(byIdx[i].accion===undefined)byIdx[i].accion=el.value; });
  document.querySelectorAll(`.linea-precio[data-id="${id}"]`).forEach(el=>{ const i=el.getAttribute('data-idx'); if(byIdx[i]===undefined)byIdx[i]={}; if(byIdx[i].precio===undefined)byIdx[i].precio=el.value; });
  const idxs = Object.keys(byIdx).map(Number).sort((a,b)=>a-b);
  return idxs.map(i=>{ const o=byIdx[i]||{}; const pRaw=o.precio||''; return {accion:(o.accion||'').trim(), precio: pRaw?(parseFloat(String(pRaw).replace(/[^0-9.]/g,''))||null):null}; });
}
// Prefiere inputs del DOM (admin) si existen, si no usa SELS/común (cliente).
function currentLineas(id){
  return document.querySelector(`.linea-accion[data-id="${id}"]`) ? collectLineas(id) : getLineas(parseInt(id));
}
// Render del bloque de líneas (editable admin / solo-lectura cliente).
function renderLinesCell(t){
  const lineas = getLineas(t.id);
  if (!IS_INTERNAL) {
    const rows = lineas.map(l => {
      const acc = l.accion ? escHtml(l.accion) : '<span style="color:#ccc">—</span>';
      const pr = (l.precio!=null && l.precio!=='') ? `<span style="font-size:12px;color:#b2005d;font-weight:700;white-space:nowrap;">${fmtPrecio(l.precio)}</span>` : '';
      return `<div style="display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid #f5f5f5;"><span style="font-size:12px;color:#333;">${acc}</span>${pr}</div>`;
    }).join('');
    return `<div class="lineas-ro" data-id="${t.id}">${rows || '<span style="color:#ccc;font-size:12px">—</span>'}</div>`;
  }
  const rows = lineas.map((l,i)=>`<div class="linea-row" data-id="${t.id}" data-idx="${i}" style="display:flex;align-items:center;gap:4px;margin-bottom:4px;">
    <input type="text" class="linea-accion" data-id="${t.id}" data-idx="${i}" value="${escAttr(l.accion)}" placeholder="Acción"
      style="flex:1;min-width:80px;border:1px solid #e0e0e0;border-radius:6px;padding:5px 7px;font-size:12px;font-family:inherit;color:#111;outline:none;">
    <span style="font-size:12px;color:#b2005d;font-weight:700;">${monedaSymbol(ROSTER.moneda)}</span>
    <input type="text" inputmode="numeric" pattern="[0-9]*" class="linea-precio" data-id="${t.id}" data-idx="${i}" value="${l.precio!=null?l.precio:''}" placeholder="0"
      style="width:62px;border:1px solid #e0e0e0;border-radius:6px;padding:5px 7px;font-size:12px;font-family:inherit;color:#111;outline:none;text-align:right;">
    <button type="button" class="del-linea-btn" data-id="${t.id}" data-idx="${i}" title="Quitar línea"
      style="background:none;border:none;color:#c66;font-size:16px;line-height:1;cursor:pointer;padding:0 2px;">×</button>
  </div>`).join('');
  return `<div class="lineas-wrap" data-id="${t.id}">${rows}
    <div style="display:flex;gap:6px;margin-top:4px;flex-wrap:wrap;">
      <button type="button" class="add-linea-btn" data-id="${t.id}"
        style="background:#fdf4f8;border:1px solid #e8c0d8;color:#b2005d;font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;cursor:pointer;font-family:inherit;">+ Acción</button>
      <button type="button" class="valores-btn" data-id="${t.id}"
        style="background:#fff7ed;border:1px solid #fcd9a8;color:#b45309;font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;cursor:pointer;font-family:inherit;">Valores</button>
      <button type="button" class="price-hist-btn" data-id="${t.id}"
        style="background:#f5f0fa;border:1px solid #d8c0ea;color:#9414E0;font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;cursor:pointer;font-family:inherit;">Historial $</button>
    </div>
  </div>`;
}

// ── Init ─────────────────────────────────────────────────────
async function init() {
  const params = new URLSearchParams(window.location.search);
  const linkToken = params.get('link');
  const legacyToken = params.get('token');
  if (!linkToken && !legacyToken) { showError('URL inválida — falta el token del roster.'); return; }

  try {
    document.getElementById('load-msg').textContent = 'Cargando roster...';

    // Check if user is logged in (internal team) — y redirigir talentos al portal
    try {
      const {data:{session}} = await sb.auth.getSession();
      if (session) {
        const {data:profile} = await sb.from('user_profiles').select('role').eq('id', session.user.id).single();
        if (profile && profile.role === 'talent') { location.href = 'talento-portal.html'; return; }
        if (profile && ['admin','campaign_manager'].includes(profile.role)) IS_INTERNAL = true;
      }
    } catch(e) {}

    // Resolve roster: via roster_links (?link=) or legacy (?token=)
    if (linkToken) {
      const { data: link, error: lErr } = await sb.from('roster_links').select('*').eq('token', linkToken).single();
      if (lErr || !link) { showError('Link no encontrado. Verificá la URL.'); return; }
      LINK_ID = link.id;
      CLIENT_NAME = link.client_name || '';
      var LINK_ROSTER_TITLE = link.roster_title || '';
      if (link.compact) {
        // Override compact mode from link setting
        Object.defineProperty(window, 'COMPACT_MODE_OVERRIDE', { value: true });
      }
      const { data: roster, error: rErr } = await sb.from('rosters').select('*').eq('id', link.roster_id).single();
      if (rErr || !roster) { showError('Roster no encontrado.'); return; }
      ROSTER = roster;
    } else {
      const { data: roster, error: rErr } = await sb.from('rosters').select('*').eq('public_token', legacyToken).single();
      if (rErr || !roster) { showError('Roster no encontrado. Verificá el link.'); return; }
      ROSTER = roster;
      LINK_ID = 0;
    }

    // Override compact from link setting
    if (window.COMPACT_MODE_OVERRIDE) COMPACT_MODE = true;

    // Internal team sees the real roster name; clients see their own brand name (or the custom link title)
    if (IS_INTERNAL) {
      DISPLAY_TITLE = (typeof LINK_ROSTER_TITLE !== 'undefined' && LINK_ROSTER_TITLE) ? LINK_ROSTER_TITLE : ROSTER.name;
    } else {
      DISPLAY_TITLE = (typeof LINK_ROSTER_TITLE !== 'undefined' && LINK_ROSTER_TITLE) ? LINK_ROSTER_TITLE : (CLIENT_NAME || ROSTER.name);
    }
    document.title = 'Roster — ' + DISPLAY_TITLE + (IS_INTERNAL && CLIENT_NAME ? ' — ' + CLIENT_NAME : '');

    const talentIds = (ROSTER.talent_ids || []).map(id => parseInt(id)).filter(Boolean);
    document.getElementById('load-msg').textContent = 'Cargando talentos...';

    // Load talents and selections in parallel
    const selQuery = sb.from('roster_selecciones').select('*').eq('roster_id', ROSTER.id).eq('link_id', LINK_ID);
    const [talentsRes, selRes] = await Promise.all([
      talentIds.length > 0
        ? sb.from('talentos').select('id,nombre,paises,ciudad,tiktok,instagram,youtube,categorias,seguidores,genero,keywords,valores').in('id', talentIds)
        : {data:[]},
      selQuery,
    ]);

    // Preserve order from talent_ids
    TALENTS = talentIds.map(id => (talentsRes.data || []).find(t => t.id === id)).filter(Boolean);
    (selRes.data || []).forEach(s => { SELS[s.talent_id] = s; });

    // Load photos in background after render (they're heavy, especially base64)
    setTimeout(async () => {
      if (!talentIds.length) return;
      const {data: photoData} = await sb.from('talentos').select('id,foto').in('id', talentIds);
      if (photoData) {
        photoData.forEach(p => {
          const t = TALENTS.find(x => x.id === p.id);
          if (t && p.foto) {
            t.foto = p.foto;
            // Update visible avatars
            document.querySelectorAll(`[data-avatar-id="${p.id}"]`).forEach(el => {
              if (p.foto.startsWith('data:') || p.foto.startsWith('https://')) {
                el.innerHTML = `<img src="${p.foto}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
              }
            });
          }
        });
      }
    }, 100);

    render();
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    restoreSelections();
    updateSummary();
  } catch(e) {
    showError('Error: ' + e.message);
  }
}

function showError(msg) {
  document.getElementById('load-msg').textContent = msg;
  document.querySelector('.loader-spinner').style.display = 'none';
}

// ── Render ────────────────────────────────────────────────────
function setRosterView(mode) {
  rosterViewMode = mode;
  _saveRosterPrefs({ view: rosterViewMode, sort: rosterSort });
  render();
  restoreSelections();
}
function setRosterSort(sort) {
  rosterSort = sort;
  _saveRosterPrefs({ view: rosterViewMode, sort: rosterSort });
  render();
  restoreSelections();
}
function applySortToTalents(talents) {
  if (rosterSort === 'default') return talents;
  return [...talents].sort(function(a, b) {
    var aS = a.seguidores || {};
    var bS = b.seguidores || {};
    if (rosterSort === 'ig-desc') return (bS.instagram||0) - (aS.instagram||0);
    if (rosterSort === 'ig-asc') return (aS.instagram||0) - (bS.instagram||0);
    if (rosterSort === 'tt-desc') return (bS.tiktok||0) - (aS.tiktok||0);
    if (rosterSort === 'tt-asc') return (aS.tiktok||0) - (bS.tiktok||0);
    return 0;
  });
}
function toggleAIView(show) {
  showAI = show;
  render();
  restoreSelections();
}

let showHidden = false; // toggle to reveal hidden talents

function render() {
  const showTT = ROSTER.platforms?.tt !== false;
  const showIG = ROSTER.platforms?.ig !== false;
  const showYT = ROSTER.platforms?.yt !== false;
  const showPriceComments = !COMPACT_MODE;
  // Filter out hidden talents (per link_id) unless showHidden is on or IS_INTERNAL
  const hiddenIds = new Set();
  Object.keys(SELS).forEach(function(id) { if (SELS[id].hidden) hiddenIds.add(parseInt(id)); });
  const visibleTalents = (showHidden || IS_INTERNAL) ? TALENTS : TALENTS.filter(function(t) { return !hiddenIds.has(t.id); });
  const today = new Date().toLocaleDateString('es-ES',{day:'2-digit',month:'long',year:'numeric'});
  const hasAIDescs = ROSTER.ai_descriptions && Object.keys(ROSTER.ai_descriptions).length > 0;
  const aiVisible = showAI !== null ? showAI : (ROSTER.show_ai_descriptions && hasAIDescs);

  const ttSVG  = '<svg width="13" height="13" viewBox="0 0 24 24" fill="#ff0050"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.27 6.27 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34l-.04-8.68a8.25 8.25 0 004.82 1.55V4.72a4.85 4.85 0 01-1.01-.03z"/></svg>';
  const igSVG  = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#e1306c" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/></svg>';
  const ytSVG  = '<svg width="13" height="13" viewBox="0 0 24 24" fill="#ff0000"><path d="M23.5 6.19a3.02 3.02 0 0 0-2.12-2.14C19.54 3.5 12 3.5 12 3.5s-7.54 0-9.38.55A3.02 3.02 0 0 0 .5 6.19C0 8.04 0 12 0 12s0 3.96.5 5.81a3.02 3.02 0 0 0 2.12 2.14C4.46 20.5 12 20.5 12 20.5s7.54 0 9.38-.55a3.02 3.02 0 0 0 2.12-2.14C24 15.96 24 12 24 12s0-3.96-.5-5.81zM9.75 15.52V8.48L15.5 12l-5.75 3.52z"/></svg>';

  // Desktop table rows
  const thStyle = 'padding:12px 14px;text-align:left;color:#fff;font-size:12px;font-weight:700;letter-spacing:0.5px;';
  const tableHeader = `<tr style="background:linear-gradient(135deg,#b2005d,#9414E0);">
    <th style="${thStyle}width:52px;text-align:center;"></th>
    <th style="${thStyle}">Talento</th><th style="${thStyle}">País</th>
    ${showTT?`<th style="${thStyle}">TikTok</th>`:''}
    ${showIG?`<th style="${thStyle}">Instagram</th>`:''}
    ${showYT?`<th style="${thStyle}">YouTube</th>`:''}
    <th style="${thStyle}">Categorías</th>
    ${showPriceComments ? `<th style="${thStyle}">Acciones y precios</th>` : ''}
    ${showPriceComments ? `<th style="${thStyle}">Comentarios</th>` : ''}
    ${showPriceComments && IS_INTERNAL ? `<th style="${thStyle}background:rgba(0,0,0,0.15)">Precio Int.</th>` : ''}
    ${showPriceComments && IS_INTERNAL ? `<th style="${thStyle}background:rgba(0,0,0,0.15)">Notas Int.</th>` : ''}
  </tr>`;

  const sortedTalents = applySortToTalents(visibleTalents);
  const tableRows = sortedTalents.map((t, i) => {
    const av = `<span data-avatar-id="${t.id}" style="display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:#f0e0e8;color:#b2005d;font-weight:800;font-size:13px;margin-right:8px;flex-shrink:0;overflow:hidden">${t.foto ? `<img src="${t.foto}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">` : ini(t.nombre)}</span>`;
    const ctries = countries(t).join('<br>');
    const ttCell = !showTT?'':t.tiktok?`<div style="display:flex;align-items:center;gap:4px;">${ttSVG}<a href="${t.tiktok}" target="_blank" style="color:#ff0050;font-size:12px;font-weight:600;">${extractH(t.tiktok)}</a></div><div style="font-size:11px;color:#777;padding-left:15px;">${fmtF(t.seguidores?.tiktok)}</div>`:'<span style="color:#ccc;">—</span>';
    const igCell = !showIG?'':t.instagram?`<div style="display:flex;align-items:center;gap:4px;">${igSVG}<a href="${t.instagram}" target="_blank" style="color:#e1306c;font-size:12px;font-weight:600;">${extractH(t.instagram)}</a></div><div style="font-size:11px;color:#777;padding-left:15px;">${fmtF(t.seguidores?.instagram)}</div>`:'<span style="color:#ccc;">—</span>';
    const ytCell = !showYT?'':t.youtube?`<div style="display:flex;align-items:center;gap:4px;">${ytSVG}<a href="${t.youtube}" target="_blank" style="color:#cc0000;font-size:12px;font-weight:600;">${extractH(t.youtube)}</a></div><div style="font-size:11px;color:#777;padding-left:15px;">${fmtF(t.seguidores?.youtube)}</div>`:'<span style="color:#ccc;">—</span>';
    const cats = (t.categorias||[]).slice(0,4).map(c=>`<span style="background:#f5f0f8;color:#7a3fa0;font-size:10px;padding:2px 7px;border-radius:10px;display:inline-block;margin:1px;">${c}</span>`).join('');
    const isHidden = hiddenIds.has(t.id);
    const rowBg = isHidden ? '#e5e7eb' : (i%2===0?'#fff':'#faf9fc');
    return `<tr id="row_${t.id}" style="background:${rowBg};transition:background 0.15s,box-shadow 0.15s;${isHidden?'opacity:0.65;':''}">
      <td style="padding:12px 14px;border-bottom:1px solid #f0f0f0;vertical-align:middle;text-align:center;width:52px;">
        <input type="checkbox" class="row-check" data-id="${t.id}" style="width:20px;height:20px;accent-color:#b2005d;cursor:pointer;display:block;margin:auto;">
      </td>
      <td style="padding:10px 14px;border-bottom:1px solid #f0f0f0;vertical-align:middle;">
        <div style="display:flex;align-items:center;">${av}<div><div style="font-weight:700;font-size:13px;color:#111;">${t.nombre}</div>${t.ciudad?`<div style="font-size:11px;color:#888;">${t.ciudad}</div>`:''}</div></div>
      </td>
      <td style="padding:10px 14px;border-bottom:1px solid #f0f0f0;vertical-align:middle;font-size:12px;color:#444;line-height:1.7;">${ctries}</td>
      ${showTT?`<td style="padding:10px 14px;border-bottom:1px solid #f0f0f0;vertical-align:middle;">${ttCell}</td>`:''}
      ${showIG?`<td style="padding:10px 14px;border-bottom:1px solid #f0f0f0;vertical-align:middle;">${igCell}</td>`:''}
      ${showYT?`<td style="padding:10px 14px;border-bottom:1px solid #f0f0f0;vertical-align:middle;">${ytCell}</td>`:''}
      <td style="padding:10px 14px;border-bottom:1px solid #f0f0f0;vertical-align:middle;"><div style="display:flex;flex-wrap:wrap;gap:2px;">${cats}</div></td>
      ${showPriceComments ? `<td style="padding:10px 14px;border-bottom:1px solid #f0f0f0;vertical-align:top;min-width:240px;">
        ${renderLinesCell(t)}
      </td>` : ''}
      ${showPriceComments ? `<td style="padding:10px 14px;border-bottom:1px solid #f0f0f0;vertical-align:middle;min-width:160px;">
        <textarea class="counter-input" data-id="${t.id}" placeholder="Comentarios..."
          style="width:100%;min-height:52px;border:1px solid #e0e0e0;border-radius:6px;padding:6px 8px;font-size:12px;font-family:inherit;color:#111;outline:none;resize:vertical;line-height:1.4;"></textarea>
      </td>` : ''}
      ${showPriceComments && IS_INTERNAL ? `<td style="padding:10px 14px;border-bottom:1px solid #f0f0f0;vertical-align:middle;width:120px;background:rgba(148,20,224,0.02)">
        <input type="text" class="admin-precio-input" data-id="${t.id}" placeholder="Precio real"
          style="width:90px;border:1px solid #d0c0e0;border-radius:6px;padding:6px 8px;font-size:12px;font-family:inherit;color:#9414E0;outline:none;font-weight:600">
      </td>` : ''}
      ${showPriceComments && IS_INTERNAL ? `<td style="padding:10px 14px;border-bottom:1px solid #f0f0f0;vertical-align:middle;min-width:140px;background:rgba(148,20,224,0.02)">
        <textarea class="admin-notes-input" data-id="${t.id}" placeholder="Notas internas..."
          style="width:100%;min-height:40px;border:1px solid #d0c0e0;border-radius:6px;padding:6px 8px;font-size:11px;font-family:inherit;color:#555;outline:none;resize:vertical"></textarea>
      </td>` : ''}
      ${LINK_ID > 0 ? `<td style="padding:6px;border-bottom:1px solid #f0f0f0;text-align:center;"><div style="display:flex;align-items:center;gap:4px;justify-content:center;">${hiddenIds.has(t.id)
        ? '<button onclick="toggleHideTalent('+t.id+')" title="Restaurar" style="background:#dcfce7;border:1px solid #86efac;color:#16a34a;width:26px;height:26px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 7v6h6"/><path d="M3 13a9 9 0 1 0 2.1-5.3L3 7"/></svg></button>'
        : '<button onclick="confirmHideTalent('+t.id+')" title="Descartar" style="background:#fef2f2;border:1px solid #fca5a5;color:#dc2626;width:26px;height:26px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>'
      }${IS_INTERNAL ? '<button onclick="confirmRemoveFromRoster('+t.id+')" title="Eliminar de Roster" style="background:#fef2f2;border:1px solid #fca5a5;color:#dc2626;width:26px;height:26px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M5 6v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6"/></svg></button>' : ''}</div></td>` : ''}
    </tr>
    ${aiVisible && ROSTER.ai_descriptions?.[t.id] ? `<tr style="background:${rowBg}"><td colspan="20" style="padding:4px 14px 12px;border-bottom:1px solid #f0f0f0;">
      <div style="background:linear-gradient(135deg,rgba(148,20,224,0.03),rgba(178,0,93,0.03));border:1px solid rgba(148,20,224,0.1);border-radius:8px;padding:8px 12px;font-size:11px;color:#555;line-height:1.5;max-width:100%"><span style="font-weight:700;color:#9414E0;font-size:10px;margin-right:4px">AI</span>${ROSTER.ai_descriptions[t.id].reason||''}</div>
    </td></tr>` : ''}`;
  }).join('');

  // Mobile cards
  const mobileCards = sortedTalents.map(t => {
    const av = `<div data-avatar-id="${t.id}" style="width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#f0e0e8,#e8d0e0);color:#b2005d;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;border:2px solid rgba(178,0,93,0.2);overflow:hidden;flex-shrink:0">${t.foto ? `<img src="${t.foto}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">` : ini(t.nombre)}</div>`;
    const ctries = countries(t).join(' · ');
    const nets = [
      showTT && t.tiktok ? `<div style="display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #f5f5f5;">${ttSVG}<a href="${t.tiktok}" target="_blank" style="color:#ff0050;font-weight:700;font-size:13px;flex:1;">${extractH(t.tiktok)}</a><span style="color:#333;font-weight:700;font-size:13px;">${fmtF(t.seguidores?.tiktok)}</span></div>` : '',
      showIG && t.instagram ? `<div style="display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #f5f5f5;">${igSVG}<a href="${t.instagram}" target="_blank" style="color:#e1306c;font-weight:700;font-size:13px;flex:1;">${extractH(t.instagram)}</a><span style="color:#333;font-weight:700;font-size:13px;">${fmtF(t.seguidores?.instagram)}</span></div>` : '',
      showYT && t.youtube ? `<div style="display:flex;align-items:center;gap:8px;padding:9px 0;">${ytSVG}<a href="${t.youtube}" target="_blank" style="color:#cc0000;font-weight:700;font-size:13px;flex:1;">${extractH(t.youtube)}</a><span style="color:#333;font-weight:700;font-size:13px;">${fmtF(t.seguidores?.youtube)}</span></div>` : '',
    ].filter(Boolean).join('');
    const cats = (t.categorias||[]).slice(0,4).map(c=>`<span style="background:#f5f0f8;color:#7a3fa0;font-size:11px;padding:3px 9px;border-radius:10px;">${c}</span>`).join(' ');
    const isHidden = hiddenIds.has(t.id);
    return `<div class="mob-card" id="mob_${t.id}" style="background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,0.07);margin-bottom:14px;transition:box-shadow 0.2s;${isHidden?'opacity:0.5;border:2px dashed #ef4444;':''}">
      <div style="background:linear-gradient(135deg,#1a1a1a,#2d2d2d);padding:16px 18px;display:flex;align-items:center;gap:14px;">
        <input type="checkbox" class="row-check" data-id="${t.id}" style="width:22px;height:22px;accent-color:#b2005d;cursor:pointer;flex-shrink:0;">
        ${av}
        <div style="flex:1;min-width:0;">
          <div style="color:#fff;font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${t.nombre}</div>
          <div style="color:rgba(255,255,255,0.5);font-size:12px;margin-top:2px;">${ctries}${t.ciudad?' · '+t.ciudad:''}</div>
        </div>
        ${LINK_ID > 0 ? `<div style="display:flex;align-items:center;gap:4px;flex-shrink:0;">${hiddenIds.has(t.id)
          ? `<button onclick="toggleHideTalent(${t.id})" title="Restaurar" style="background:rgba(34,197,94,0.2);border:none;color:#4ade80;width:28px;height:28px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 7v6h6"/><path d="M3 13a9 9 0 1 0 2.1-5.3L3 7"/></svg></button>`
          : `<button onclick="confirmHideTalent(${t.id})" title="Descartar" style="background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#ef4444;width:28px;height:28px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>`
        }${IS_INTERNAL ? `<button onclick="confirmRemoveFromRoster(${t.id})" title="Eliminar de Roster" style="background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#ef4444;width:28px;height:28px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M5 6v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6"/></svg></button>` : ''}</div>` : ''}
      </div>
      ${nets?`<div style="padding:0 18px;">${nets}</div>`:''}
      ${cats?`<div style="padding:10px 18px;border-top:1px solid #f5f5f5;display:flex;flex-wrap:wrap;gap:5px;">${cats}</div>`:''}
      ${aiVisible && ROSTER.ai_descriptions?.[t.id] ? `<div style="padding:8px 18px;border-top:1px solid #f5f5f5"><div style="background:linear-gradient(135deg,rgba(148,20,224,0.04),rgba(178,0,93,0.04));border:1px solid rgba(148,20,224,0.12);border-radius:8px;padding:8px 10px;font-size:11px;color:#666;line-height:1.4"><span style="font-weight:700;color:#9414E0;font-size:10px">AI</span> ${ROSTER.ai_descriptions[t.id].reason||''}</div></div>` : ''}
      ${showPriceComments ? `<div style="padding:12px 18px 16px;background:#fdfbfe;border-top:1px solid #f0eaf5;">
        <div style="margin-bottom:10px;">
          <label style="font-size:11px;font-weight:700;color:#b2005d;letter-spacing:0.5px;text-transform:uppercase;display:block;margin-bottom:5px;">Acciones y precios</label>
          ${renderLinesCell(t)}
        </div>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <div style="flex:1;min-width:120px">
            <label style="font-size:11px;font-weight:700;color:#666;letter-spacing:0.5px;text-transform:uppercase;display:block;margin-bottom:5px;">Comentarios</label>
            <textarea class="counter-input" data-id="${t.id}" placeholder="Comentarios..."
              style="width:100%;min-height:52px;border:1.5px solid #e0e0e0;border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;color:#111;outline:none;resize:vertical;background:#fff;line-height:1.4;"></textarea>
          </div>
        </div>
        ${IS_INTERNAL ? `<div style="margin-top:10px;padding-top:10px;border-top:1px dashed #e0d0f0;display:flex;gap:12px">
          <div style="flex:1">
            <label style="font-size:10px;font-weight:700;color:#9414E0;letter-spacing:0.5px;text-transform:uppercase;display:block;margin-bottom:4px">Precio Interno</label>
            <input type="text" class="admin-precio-input" data-id="${t.id}" placeholder="Precio real"
              style="width:100%;border:1px solid #d0c0e0;border-radius:6px;padding:6px 8px;font-size:12px;font-family:inherit;color:#9414E0;outline:none;font-weight:600">
          </div>
          <div style="flex:2">
            <label style="font-size:10px;font-weight:700;color:#9414E0;letter-spacing:0.5px;text-transform:uppercase;display:block;margin-bottom:4px">Notas Internas</label>
            <textarea class="admin-notes-input" data-id="${t.id}" placeholder="Solo visible para el equipo..."
              style="width:100%;min-height:36px;border:1px solid #d0c0e0;border-radius:6px;padding:6px 8px;font-size:11px;font-family:inherit;color:#555;outline:none;resize:vertical"></textarea>
          </div>
        </div>` : ''}
      </div>` : ''}
    </div>`;
  }).join('');

  const header = `
    <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;padding-bottom:16px;border-bottom:3px solid #b2005d;flex-wrap:wrap;gap:12px;">
      <div>
        <div style="font-size:24px;font-weight:300;margin-bottom:5px;">Be<strong style="font-weight:800;color:#b2005d">me</strong></div>
        <div style="font-family:'Syne',sans-serif;font-size:19px;font-weight:700;color:#111;">${DISPLAY_TITLE}</div>
        ${IS_INTERNAL && CLIENT_NAME ? `<div style="font-size:12px;color:#b2005d;font-weight:600;margin-top:2px;">Para: ${CLIENT_NAME}</div>` : ''}
        ${ROSTER.description && IS_INTERNAL?`<div style="font-size:13px;color:#666;margin-top:3px;">${ROSTER.description}</div>`:''}
      </div>
      <div style="text-align:right;">
        <div style="font-size:12px;color:#888;line-height:1.8;">
          <div style="font-weight:700;color:#111;">${visibleTalents.length} talento${visibleTalents.length!==1?'s':''}${hiddenIds.size ? ' <span style="font-size:11px;font-weight:400;color:#888;">(' + hiddenIds.size + ' oculto' + (hiddenIds.size!==1?'s':'') + ')</span>' : ''}</div>
          <div>${today}</div>
          <div style="font-weight:600;color:#b2005d;">Moneda: ${ROSTER.moneda || 'USD'}</div>
        </div>
        ${IS_INTERNAL
          ? `<div style="margin-top:8px;font-size:11px;padding:4px 10px;background:linear-gradient(135deg,rgba(148,20,224,0.08),rgba(106,13,158,0.08));border:1px solid rgba(148,20,224,0.2);border-radius:10px;color:#9414E0;font-weight:700;">Vista Admin/Manager</div>`
          : ''
        }
        <div style="display:flex;gap:6px;margin-top:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap;">
          <select onchange="setRosterSort(this.value)" style="font-family:inherit;font-size:11px;padding:4px 8px;border:1px solid #ddd;border-radius:6px;background:#fff;color:#555;cursor:pointer;">
            <option value="default" ${rosterSort==='default'?'selected':''}>Orden original</option>
            <option value="ig-desc" ${rosterSort==='ig-desc'?'selected':''}>IG: Mayor → Menor</option>
            <option value="ig-asc" ${rosterSort==='ig-asc'?'selected':''}>IG: Menor → Mayor</option>
            <option value="tt-desc" ${rosterSort==='tt-desc'?'selected':''}>TT: Mayor → Menor</option>
            <option value="tt-asc" ${rosterSort==='tt-asc'?'selected':''}>TT: Menor → Mayor</option>
          </select>
          ${hasAIDescs ? `<label style="display:flex;align-items:center;gap:4px;font-size:11px;color:#888;cursor:pointer"><input type="checkbox" ${aiVisible?'checked':''} onchange="toggleAIView(this.checked)" style="accent-color:#9414E0"> AI</label>` : ''}
          <button onclick="setRosterView('table')" style="width:30px;height:30px;border-radius:6px;border:1px solid ${rosterViewMode==='table'?'#b2005d':'#ddd'};background:${rosterViewMode==='table'?'#fdf4f8':'#fff'};cursor:pointer;display:flex;align-items:center;justify-content:center" title="Tabla">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="${rosterViewMode==='table'?'#b2005d':'#888'}" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>
          </button>
          <button onclick="setRosterView('cards')" style="width:30px;height:30px;border-radius:6px;border:1px solid ${rosterViewMode==='cards'?'#b2005d':'#ddd'};background:${rosterViewMode==='cards'?'#fdf4f8':'#fff'};cursor:pointer;display:flex;align-items:center;justify-content:center" title="Tarjetas">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="${rosterViewMode==='cards'?'#b2005d':'#888'}" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
          </button>
        </div>
      </div>
    </div>`;

  let content = '';
  if (visibleTalents.length === 0 && hiddenIds.size === 0) {
    content = '<p style="text-align:center;color:#999;padding:40px;">Este roster no tiene talentos todavia.</p>';
  } else if (rosterViewMode === 'cards') {
    content = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px">${mobileCards}</div>`;
  } else {
    content = `
    <div class="desktop-view"><div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;box-shadow:0 2px 16px rgba(0,0,0,0.06);">
        <thead>${tableHeader}</thead><tbody>${tableRows}</tbody>
      </table>
    </div></div>
    <div class="mobile-view">
      <div style="margin-bottom:14px;font-size:13px;color:#888;">${visibleTalents.length} talentos${hiddenIds.size ? ' · <a href="#" onclick="showHidden=!showHidden;render();restoreSelections();return false;" style="color:#b2005d;">' + (showHidden ? 'Ocultar descartados' : 'Ver ' + hiddenIds.size + ' descartado' + (hiddenIds.size!==1?'s':'')) + '</a>' : ''}</div>
      ${mobileCards}
    </div>`;
  }
  const comunPanel = IS_INTERNAL ? renderComunPanel() : '';
  document.getElementById('page-content').innerHTML = header + comunPanel + content;
}

// ── Acciones comunes del roster (solo admin) ──────────────────
function renderComunesRows(){
  const comunes = Array.isArray(ROSTER.lineas_comunes) ? ROSTER.lineas_comunes : [];
  if (!comunes.length) return '<div style="font-size:12px;color:#bbb;padding:4px 0;">Sin acciones comunes. Agregá una.</div>';
  return comunes.map((l,i)=>`<div class="comun-row" data-idx="${i}" style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
    <input type="text" class="comun-accion" data-idx="${i}" value="${escAttr(l.accion||'')}" placeholder="Ej. 1 Reel + 2 Stories"
      style="flex:1;border:1px solid #d8c8ea;border-radius:6px;padding:6px 8px;font-size:13px;font-family:inherit;outline:none;">
    <button type="button" class="del-comun-btn" data-idx="${i}" title="Quitar" style="background:none;border:none;color:#c66;font-size:18px;line-height:1;cursor:pointer;padding:0 4px;">×</button>
  </div>`).join('');
}
function renderComunPanel(){
  return `<div style="background:#faf7fd;border:1px solid #e8def5;border-radius:12px;padding:14px 16px;margin-bottom:18px;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
      <div style="font-size:13px;font-weight:700;color:#9414E0;">Acciones comunes del roster</div>
      <label style="font-size:12px;color:#555;display:flex;align-items:center;gap:5px;cursor:pointer;"><input type="checkbox" id="mostrar-total-check" ${ROSTER.mostrar_total?'checked':''} style="accent-color:#9414E0;"> Mostrar total sumado</label>
    </div>
    <div style="font-size:11px;color:#888;margin:4px 0 10px;">Se aplican a los talentos sin acciones propias. Editá las líneas de un talento para sobrescribir solo a ese.</div>
    <div id="comunes-wrap">${renderComunesRows()}</div>
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
      <button type="button" id="add-comun-btn" style="background:#fdf4f8;border:1px solid #e8c0d8;color:#b2005d;font-size:12px;font-weight:700;padding:6px 12px;border-radius:7px;cursor:pointer;font-family:inherit;">+ Acción común</button>
      <button type="button" id="apply-comun-btn" style="background:#9414E0;border:none;color:#fff;font-size:12px;font-weight:700;padding:6px 12px;border-radius:7px;cursor:pointer;font-family:inherit;">Aplicar a todos</button>
    </div>
  </div>`;
}
function collectComunes(){
  const arr = [];
  document.querySelectorAll('.comun-accion').forEach(el=>{ arr.push({accion: el.value.trim()}); });
  return arr;
}
function addComun(){
  ROSTER.lineas_comunes = collectComunes();
  ROSTER.lineas_comunes.push({accion:''});
  const wrap = document.getElementById('comunes-wrap');
  if (wrap) wrap.innerHTML = renderComunesRows();
  saveRosterCommon();
}
function delComun(idx){
  ROSTER.lineas_comunes = collectComunes();
  ROSTER.lineas_comunes.splice(idx,1);
  const wrap = document.getElementById('comunes-wrap');
  if (wrap) wrap.innerHTML = renderComunesRows();
  saveRosterCommon();
}
let _comunTimer = null;
function queueSaveComun(){ clearTimeout(_comunTimer); _comunTimer = setTimeout(saveRosterCommon, 700); }
async function saveRosterCommon(){
  ROSTER.lineas_comunes = collectComunes();
  const chk = document.getElementById('mostrar-total-check');
  if (chk) ROSTER.mostrar_total = chk.checked;
  const badge = document.getElementById('save-badge');
  try {
    await sb.from('rosters').update({lineas_comunes: ROSTER.lineas_comunes, mostrar_total: !!ROSTER.mostrar_total}).eq('id', ROSTER.id);
    badge.textContent='✓ Guardado'; badge.style.background='#1D9E75';
  } catch(e){ badge.textContent='✗ Error al guardar'; badge.style.background='#cc0000'; }
  badge.classList.add('show'); setTimeout(()=>badge.classList.remove('show'),2000);
}
async function applyComunToAll(){
  ROSTER.lineas_comunes = collectComunes();
  await saveRosterCommon();
  const comunes = ROSTER.lineas_comunes.filter(l=>l.accion);
  if (!comunes.length){ alert('Agregá al menos una acción común primero.'); return; }
  const forzar = confirm('¿Sobrescribir TAMBIÉN los talentos que ya tienen acciones propias?\n\nAceptar = forzar a TODOS.\nCancelar = solo rellenar los que están vacíos.');
  let count = 0;
  for (const t of TALENTS) {
    const cur = (SELS[t.id] && Array.isArray(SELS[t.id].lineas)) ? SELS[t.id].lineas : [];
    const hasOwn = cur.some(l => (l.accion && l.accion.trim()) || l.precio != null);
    if (forzar || !hasOwn) {
      const merged = comunes.map((c,i)=>({accion: c.accion, precio: (cur[i] && cur[i].precio != null) ? cur[i].precio : null}));
      const row = Object.assign({}, SELS[t.id], {lineas: merged, roster_id: ROSTER.id, talent_id: t.id, link_id: LINK_ID});
      SELS[t.id] = row;
      await persistSelection(row);
      count++;
    }
  }
  render(); restoreSelections(); updateSummary();
  alert('Acciones comunes aplicadas a ' + count + ' talento(s).');
}

// ── Restore previous selections ───────────────────────────────
function restoreSelections() {
  Object.entries(SELS).forEach(([tid, sel]) => {
    const id = parseInt(tid);
    // Checkboxes
    document.querySelectorAll(`.row-check[data-id="${id}"]`).forEach(chk => {
      chk.checked = sel.selected;
      highlightRow(chk);
    });
    // Las líneas acción→precio van horneadas en el HTML (getLineas en render). No hace falta restaurarlas.
    document.querySelectorAll(`.admin-precio-input[data-id="${id}"]`).forEach(el => { if(sel.admin_precio) el.value = sel.admin_precio; });
    document.querySelectorAll(`.admin-notes-input[data-id="${id}"]`).forEach(el => { if(sel.admin_notes) el.value = sel.admin_notes; });
    document.querySelectorAll(`.counter-input[data-id="${id}"]`).forEach(el => { if(sel.contraoferta) el.value = sel.contraoferta; });
  });
}

// ── Highlight row ─────────────────────────────────────────────
function highlightRow(checkbox) {
  const id = checkbox.getAttribute('data-id');
  const row = document.getElementById('row_' + id);
  if (row) { row.style.background = checkbox.checked ? '#fff5f9' : ''; row.style.boxShadow = checkbox.checked ? 'inset 3px 0 0 #b2005d' : ''; }
  const card = document.getElementById('mob_' + id);
  if (card) card.style.boxShadow = checkbox.checked ? '0 4px 20px rgba(178,0,93,0.18),inset 0 0 0 2px #b2005d' : '0 2px 12px rgba(0,0,0,0.07)';
  document.querySelectorAll(`.row-check[data-id="${id}"]`).forEach(c => { c.checked = checkbox.checked; });
}

// ── Remove talents from roster (permanently, admin only) ─────
async function removeSelectedFromRoster() {
  const checked = document.querySelectorAll('.row-check:checked');
  const seen = {}; const ids = [];
  checked.forEach(c => { const id = c.getAttribute('data-id'); if(!seen[id]){seen[id]=true;ids.push(parseInt(id));} });
  if (!ids.length) return;
  const names = ids.map(id => { const t = TALENTS.find(x => String(x.id)===String(id)); return t ? t.nombre : id; });
  if (!confirm(`¿Eliminar ${ids.length} talento${ids.length!==1?'s':''} del roster definitivamente?\n\n${names.join(', ')}\n\nEsta acción no se puede deshacer.`)) return;

  try {
    // Remove from talent_ids array
    const newIds = (ROSTER.talent_ids||[]).map(id=>parseInt(id)).filter(id => !ids.includes(id));
    await sb.from('rosters').update({talent_ids: newIds}).eq('id', ROSTER.id);
    // Remove ALL selections for these talents (across all links)
    for (const id of ids) {
      await sb.from('roster_selecciones').delete().eq('roster_id', ROSTER.id).eq('talent_id', id);
      delete SELS[id];
    }
    ROSTER.talent_ids = newIds;
    TALENTS = TALENTS.filter(t => !ids.includes(t.id));
    render();
    restoreSelections();
    updateSummary();
  } catch(e) {
    alert('Error: ' + e.message);
  }
}

// ── Remove single talent from roster (admin only) ────────────
async function confirmRemoveFromRoster(talentId) {
  var id = parseInt(talentId);
  var t = TALENTS.find(function(x){return x.id===id;});
  var nombre = t ? t.nombre : 'este talento';
  if (!confirm('¿Eliminar a ' + nombre + ' del roster definitivamente?\n\nEsta acción no se puede deshacer.')) return;
  try {
    var newIds = (ROSTER.talent_ids||[]).map(function(x){return parseInt(x);}).filter(function(x){return x!==id;});
    await sb.from('rosters').update({talent_ids: newIds}).eq('id', ROSTER.id);
    await sb.from('roster_selecciones').delete().eq('roster_id', ROSTER.id).eq('talent_id', id);
    delete SELS[id];
    ROSTER.talent_ids = newIds;
    TALENTS = TALENTS.filter(function(x){return x.id!==id;});
    render();
    restoreSelections();
    updateSummary();
  } catch(e) {
    alert('Error: ' + e.message);
  }
}

// ── Save to Supabase (debounced) ──────────────────────────────
let _saveTimers = {};
function queueSave(talentId) {
  clearTimeout(_saveTimers[talentId]);
  _saveTimers[talentId] = setTimeout(() => saveSelection(talentId), 900);
}

// Persiste una fila ya armada (sin leer el DOM). Mantiene espejo legacy accion/precio.
async function persistSelection(row){
  row.accion = (row.lineas||[]).map(l=>l.accion).filter(Boolean).join(' + ');
  const tot = (row.lineas||[]).reduce((s,l)=> s + (l.precio!=null ? Number(l.precio) : 0), 0);
  row.precio = tot>0 ? tot : null;
  row.updated_at = new Date().toISOString();
  try { await sb.from('roster_selecciones').upsert(row, { onConflict: 'roster_id,talent_id,link_id' }); }
  catch(e){ console.warn('persist error:', e); }
}

async function saveSelection(talentId) {
  const id = parseInt(talentId);
  const chk = document.querySelector(`.row-check[data-id="${id}"]`);
  const counterEl = document.querySelector(`.counter-input[data-id="${id}"]`);
  const adminPrecioEl = document.querySelector(`.admin-precio-input[data-id="${id}"]`);
  const adminNotesEl = document.querySelector(`.admin-notes-input[data-id="${id}"]`);
  const prev = SELS[id] || {};

  // Las líneas las edita SOLO el admin; para el cliente preservamos las existentes (getLineas maneja fallbacks).
  const lineas = IS_INTERNAL ? collectLineas(id) : getLineas(id);
  const tot = lineas.reduce((s,l)=> s + (l.precio!=null ? Number(l.precio) : 0), 0);

  const row = {
    roster_id: ROSTER.id,
    talent_id: id,
    link_id: LINK_ID,
    selected: chk ? chk.checked : (prev.selected || false),
    lineas: lineas,
    // espejo legacy para CSV/reportes viejos
    accion: lineas.map(l=>l.accion).filter(Boolean).join(' + '),
    precio: tot>0 ? tot : null,
    // "Comentarios" del cliente sigue guardándose en la columna contraoferta
    contraoferta: counterEl ? counterEl.value.trim() : (prev.contraoferta || ''),
    admin_precio: adminPrecioEl ? adminPrecioEl.value.trim() : (prev.admin_precio || ''),
    admin_notes: adminNotesEl ? adminNotesEl.value.trim() : (prev.admin_notes || ''),
    updated_at: new Date().toISOString()
  };
  // Track who edited: brand edits trigger notification for admin
  if (!IS_INTERNAL) {
    row.last_brand_edit = new Date().toISOString();
  }
  SELS[id] = row;

  const badge = document.getElementById('save-badge');
  try {
    await sb.from('roster_selecciones').upsert(row, { onConflict: 'roster_id,talent_id,link_id' });
    badge.textContent = '✓ Guardado';
    badge.style.background = '#1D9E75';
  } catch(e) {
    badge.textContent = '✗ Error al guardar';
    badge.style.background = '#cc0000';
  }
  badge.classList.add('show');
  setTimeout(() => badge.classList.remove('show'), 2000);
}

// ── Summary bar ───────────────────────────────────────────────
function confirmHideTalent(talentId) {
  var t = TALENTS.find(function(x){return x.id===parseInt(talentId);});
  var nombre = t ? t.nombre : 'este talento';
  if (confirm('Descartar a ' + nombre + '?')) {
    setHideTalent(talentId, true);
  }
}

async function toggleHideTalent(talentId) {
  var id = parseInt(talentId);
  var isHidden = SELS[id] && SELS[id].hidden;
  setHideTalent(id, !isHidden);
}

async function setHideTalent(talentId, hidden) {
  var id = parseInt(talentId);
  var sel = SELS[id] || { roster_id: ROSTER.id, talent_id: id, link_id: LINK_ID, selected: false };
  sel.hidden = hidden;
  sel.link_id = LINK_ID;
  sel.roster_id = ROSTER.id;
  sel.talent_id = id;
  sel.updated_at = new Date().toISOString();
  SELS[id] = sel;
  try {
    await sb.from('roster_selecciones').upsert(sel, { onConflict: 'roster_id,talent_id,link_id' });
  } catch(e) { console.warn('hide error:', e); }
  render();
  restoreSelections();
}

function bulkHideSelected() {
  var checked = document.querySelectorAll('.row-check:checked');
  var ids = [];
  checked.forEach(function(c) { var id = parseInt(c.getAttribute('data-id')); if (ids.indexOf(id) === -1) ids.push(id); });
  if (!ids.length) return;
  var names = ids.map(function(id) { var t = TALENTS.find(function(x){return x.id===id;}); return t ? t.nombre : id; });
  if (!confirm('Descartar ' + ids.length + ' talento' + (ids.length!==1?'s':'') + '?\n\n' + names.join(', '))) return;
  ids.forEach(function(id) { setHideTalent(id, true); });
}

function updateSummary() {
  const checked = document.querySelectorAll('.row-check:checked');
  const seen = {}; const unique = [];
  checked.forEach(c => { const id = c.getAttribute('data-id'); if(!seen[id]){ seen[id]=true; unique.push(id); } });

  const bar = document.getElementById('summary-bar');
  if (!unique.length) { bar.style.opacity='0'; bar.style.transform='translateY(100%)'; return; }
  bar.style.opacity='1'; bar.style.transform='translateY(0)';

  let total=0, hasPrice=false, html='';
  unique.forEach(id => {
    const t = TALENTS.find(x => String(x.id)===String(id));
    if (!t) return;
    const lineas = currentLineas(id);
    const subtotal = lineas.reduce((s,l)=> s + (l.precio!=null && l.precio!=='' ? Number(l.precio) : 0), 0);
    const co = (document.querySelector(`.counter-input[data-id="${id}"]`)?.value||'').trim();
    const a = lineas.map(l=>l.accion).filter(Boolean).join(', ');
    if(subtotal>0) hasPrice=true;
    total+=subtotal;
    html+='<div style="display:flex;align-items:flex-start;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.1);gap:12px;">'
      +'<div><div style="font-weight:700;font-size:13px;">'+t.nombre+'</div>'+(a?'<div style="font-size:11px;opacity:0.7;margin-top:1px;">'+a+'</div>':'')+(co?'<div style="font-size:10px;opacity:0.6;margin-top:2px;font-style:italic;">'+co+'</div>':'')+'</div>'
      +'<div style="text-align:right;flex-shrink:0;">'
      +(subtotal>0?'<div style="font-size:12px;font-weight:700;">'+fmtPrecio(subtotal)+'</div>':'<span style="font-size:12px;opacity:0.4;">Sin precio</span>')
      +'</div></div>';
  });

  document.getElementById('sum-count').textContent = unique.length+' talento'+(unique.length!==1?'s':'')+' seleccionado'+(unique.length!==1?'s':'');
  const tw = document.getElementById('sum-total-wrap');
  // El total sumado solo se muestra si el admin activó "Mostrar total sumado"
  if(ROSTER.mostrar_total && hasPrice){ document.getElementById('sum-total').textContent=fmtPrecio(total); tw.style.display='flex'; } else tw.style.display='none';
  document.getElementById('sum-list').innerHTML = html;
  // Show remove button (admin only, works in all modes including compact)
  const removeBtn = document.getElementById('remove-selected-btn');
  if (removeBtn) removeBtn.style.display = (unique.length && IS_INTERNAL) ? 'block' : 'none';
  // Show hide button for link-based rosters
  const hideBtn = document.getElementById('hide-selected-btn');
  if (hideBtn) hideBtn.style.display = (unique.length && LINK_ID > 0) ? 'block' : 'none';
}

// ── Event delegation ──────────────────────────────────────────
document.addEventListener('change', e => {
  if (e.target.classList.contains('row-check')) {
    highlightRow(e.target);
    queueSave(e.target.getAttribute('data-id'));
    updateSummary();
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  // Acciones comunes del roster (admin)
  if (el.classList.contains('comun-accion')) { queueSaveComun(); return; }
  // Líneas acción→precio por talento
  const lineClasses = ['linea-accion','linea-precio'];
  if (lineClasses.some(c => el.classList.contains(c))) {
    if (el.classList.contains('linea-precio')) {
      const cleaned = el.value.replace(/[^0-9.]/g, '').replace(/(\..*)\./g, '$1');
      if (cleaned !== el.value) el.value = cleaned;
    }
    const id = el.getAttribute('data-id');
    const idx = el.getAttribute('data-idx');
    const cls = lineClasses.find(c => el.classList.contains(c));
    // Sincronizar la misma línea entre vistas (desktop+móvil)
    document.querySelectorAll('.'+cls+'[data-id="'+id+'"][data-idx="'+idx+'"]').forEach(x => { if(x!==el) x.value=el.value; });
    queueSave(id);
    updateSummary();
    return;
  }
  // Comentarios / campos internos
  const saveable = ['counter-input','admin-precio-input','admin-notes-input'];
  if (saveable.some(cls => el.classList.contains(cls))) {
    const id = el.getAttribute('data-id');
    const cls = saveable.find(c => el.classList.contains(c));
    if (cls) document.querySelectorAll('.'+cls+'[data-id="'+id+'"]').forEach(x => { if(x!==el) x.value=el.value; });
    queueSave(id);
    updateSummary();
  }
});
document.addEventListener('change', e => {
  if (e.target && e.target.id === 'mostrar-total-check') { saveRosterCommon(); updateSummary(); }
});
// Botones: agregar/quitar línea, acciones comunes, historial de precios
document.addEventListener('click', e => {
  const addBtn = e.target.closest && e.target.closest('.add-linea-btn');
  if (addBtn) {
    const id = parseInt(addBtn.getAttribute('data-id'));
    const lineas = collectLineas(id); // captura lo tipeado antes de re-render
    lineas.push({accion:'', precio:null});
    SELS[id] = Object.assign({}, SELS[id], {lineas, roster_id: ROSTER.id, talent_id: id, link_id: LINK_ID});
    render(); restoreSelections(); updateSummary();
    saveSelection(id);
    return;
  }
  const delBtn = e.target.closest && e.target.closest('.del-linea-btn');
  if (delBtn) {
    const id = parseInt(delBtn.getAttribute('data-id'));
    const idx = parseInt(delBtn.getAttribute('data-idx'));
    const lineas = collectLineas(id);
    lineas.splice(idx,1);
    if (!lineas.length) lineas.push({accion:'', precio:null});
    SELS[id] = Object.assign({}, SELS[id], {lineas, roster_id: ROSTER.id, talent_id: id, link_id: LINK_ID});
    render(); restoreSelections(); updateSummary();
    saveSelection(id);
    return;
  }
  if (e.target.closest && e.target.closest('#add-comun-btn')) { addComun(); return; }
  const delC = e.target.closest && e.target.closest('.del-comun-btn');
  if (delC) { delComun(parseInt(delC.getAttribute('data-idx'))); return; }
  if (e.target.closest && e.target.closest('#apply-comun-btn')) { applyComunToAll(); return; }
  const histBtn = e.target.closest && e.target.closest('.price-hist-btn');
  if (histBtn) { openPriceHistory(parseInt(histBtn.getAttribute('data-id'))); return; }
  const valBtn = e.target.closest && e.target.closest('.valores-btn');
  if (valBtn) { openValores(parseInt(valBtn.getAttribute('data-id'))); return; }
});
document.addEventListener('focusin', e => {
  if (e.target.classList.contains('linea-accion') || e.target.classList.contains('linea-precio')) e.target.style.borderColor='#b2005d';
  if (e.target.classList.contains('counter-input')) e.target.style.borderColor='#9414E0';
});
document.addEventListener('focusout', e => {
  if (e.target.classList.contains('linea-accion') || e.target.classList.contains('linea-precio')) e.target.style.borderColor='#e0e0e0';
  if (e.target.classList.contains('counter-input')) e.target.style.borderColor='#e8d8ff';
});

// ── Export CSV ────────────────────────────────────────────────
document.getElementById('export-btn').addEventListener('click', () => {
  const checked = document.querySelectorAll('.row-check:checked');
  const seen={}; const ids=[];
  checked.forEach(c => { const id=c.getAttribute('data-id'); if(!seen[id]){seen[id]=true;ids.push(id);} });
  if (!ids.length) { alert('Seleccioná al menos un talento primero.'); return; }
  const lines = [COMPACT_MODE
    ? 'Talento,País,TikTok,Instagram,YouTube,Acciones'
    : 'Talento,País,TikTok,Instagram,YouTube,Acciones,Total,Comentarios'];
  ids.forEach(id => {
    const t = TALENTS.find(x => String(x.id)===String(id));
    if (!t) return;
    const lineas = currentLineas(id);
    const a = lineas.map(l => l.accion + (l.precio!=null&&l.precio!==''?': $'+Number(l.precio).toLocaleString('es-ES'):'')).filter(s=>s.trim()&&s!==': ').join('; ');
    const total = lineas.reduce((s,l)=> s + (l.precio!=null&&l.precio!==''?Number(l.precio):0), 0);
    const co = document.querySelector(`.counter-input[data-id="${id}"]`)?.value||'';
    const paises = (t.paises||[]).filter(Boolean).join(';');
    const baseCols = ['"'+t.nombre.replace(/"/g,'""')+'"','"'+paises+'"',
      t.tiktok?'"'+t.tiktok+'"':'""', t.instagram?'"'+t.instagram+'"':'""',
      t.youtube?'"'+t.youtube+'"':'""', '"'+a.replace(/"/g,'""')+'"'];
    lines.push(COMPACT_MODE ? baseCols.join(',') : [...baseCols, total||'', '"'+co.replace(/"/g,'""')+'"'].join(','));
  });
  const blob = new Blob(['\uFEFF'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='seleccion.csv'; a.click(); URL.revokeObjectURL(url);
});

// ── Historial de precios por creador (solo admin) ─────────────
function closePriceHistory(){ document.getElementById('price-hist-modal').style.display='none'; }
async function openPriceHistory(talentId){
  if (!IS_INTERNAL) return;
  const tid = parseInt(talentId);
  const t = TALENTS.find(x => x.id === tid);
  const modal = document.getElementById('price-hist-modal');
  document.getElementById('ph-title').textContent = 'Historial de precios — ' + (t ? t.nombre : ('#'+tid));
  document.getElementById('ph-body').innerHTML = '<div style="text-align:center;color:#888;padding:30px;">Cargando...</div>';
  modal.style.display = 'flex';
  try {
    // RLS-safe: cargamos por separado y unimos en JS (los JOIN por FK fallan en silencio)
    const { data: sels } = await sb.from('roster_selecciones')
      .select('roster_id, link_id, lineas, accion, precio, updated_at')
      .eq('talent_id', tid);
    const rows = (sels||[]).filter(s =>
      (Array.isArray(s.lineas) && s.lineas.some(l => l.precio!=null || l.accion)) || s.accion || s.precio!=null
    );
    if (!rows.length) { document.getElementById('ph-body').innerHTML = '<div style="text-align:center;color:#999;padding:30px;">Sin historial de precios.</div>'; return; }
    const rosterIds = [...new Set(rows.map(s => s.roster_id))];
    const linkIds = [...new Set(rows.map(s => s.link_id).filter(id => id > 0))];
    const [rRes, lRes] = await Promise.all([
      sb.from('rosters').select('id,name,moneda').in('id', rosterIds),
      linkIds.length ? sb.from('roster_links').select('id,client_name,roster_title').in('id', linkIds) : Promise.resolve({data:[]}),
    ]);
    const rById = Object.fromEntries((rRes.data||[]).map(r => [r.id, r]));
    const lById = Object.fromEntries((lRes.data||[]).map(l => [l.id, l]));
    const entries = rows.map(s => {
      const r = rById[s.roster_id], l = s.link_id > 0 ? lById[s.link_id] : null;
      const rosterName = (l && l.roster_title) || (r && r.name) || ('Roster #'+s.roster_id);
      const cliente = l && l.client_name ? l.client_name : '';
      const moneda = (r && r.moneda) || 'USD';
      const lineas = (Array.isArray(s.lineas) && s.lineas.length) ? s.lineas
        : ((s.accion || s.precio!=null) ? [{accion: s.accion||'', precio: s.precio}] : []);
      return { date: s.updated_at, rosterName, cliente, moneda, lineas };
    }).sort((a,b) => new Date(b.date) - new Date(a.date));
    document.getElementById('ph-body').innerHTML = entries.map(e => {
      const d = e.date ? new Date(e.date) : null;
      const ds = d ? d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'}) : '—';
      const lineasHtml = e.lineas.map(l => `<div style="display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:2px 0;">
        <span style="color:#444;">${escHtml(l.accion)||'—'}</span>
        ${(l.precio!=null && l.precio!=='') ? `<span style="color:#b2005d;font-weight:700;white-space:nowrap;">${fmtPrecio(l.precio, e.moneda)}</span>` : ''}
      </div>`).join('') || '<span style="color:#bbb;font-size:12px;">—</span>';
      return `<div style="border:1px solid #eee;border-radius:10px;padding:10px 12px;margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px;">
          <span style="font-weight:700;font-size:13px;color:#111;">${escHtml(e.rosterName)}${e.cliente?` <span style="font-weight:500;color:#9414E0;font-size:11px;">· ${escHtml(e.cliente)}</span>`:''}</span>
          <span style="font-size:11px;color:#888;white-space:nowrap;">${ds}</span>
        </div>
        ${lineasHtml}
      </div>`;
    }).join('');
  } catch(e) {
    document.getElementById('ph-body').innerHTML = '<div style="text-align:center;color:#cc0000;padding:30px;">Error: '+e.message+'</div>';
  }
}
// Cerrar el modal al hacer clic en el fondo
document.getElementById('price-hist-modal').addEventListener('click', e => { if (e.target.id === 'price-hist-modal') closePriceHistory(); });

// ── Valores de contenido del talento (solo admin) ─────────────
function closeValores(){ document.getElementById('valores-modal').style.display='none'; }
function openValores(talentId){
  if (!IS_INTERNAL) return;
  const tid = parseInt(talentId);
  const t = TALENTS.find(x => x.id === tid);
  document.getElementById('val-title').textContent = 'Valores de contenido — ' + (t ? t.nombre : ('#'+tid));
  const v = (t && t.valores) ? String(t.valores).trim() : '';
  document.getElementById('val-body').innerHTML = v ? escHtml(v) : '<span style="color:#999;">Este talento no tiene valores de contenido cargados.</span>';
  document.getElementById('valores-modal').style.display = 'flex';
}
document.getElementById('valores-modal').addEventListener('click', e => { if (e.target.id === 'valores-modal') closeValores(); });

init();
</script>
