[build]
  environment = { NODE_VERSION = "18", SECRETS_SCAN_OMIT_KEYS = "CAMPAIGN_SUMMARY_EMAILS", SECRETS_SCAN_OMIT_PATHS = ".env.example,docs/**" }

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."contract-agent"]
  timeout = 26

[functions."roster-agent"]
  timeout = 30

[functions."campaign-summary"]
  timeout = 15
  schedule = "0 11 * * *"  # 5:00 AM Mexico City (UTC-6)

[functions."campaign-notifications"]
  timeout = 20
  schedule = "0 12 * * *"  # 6:00 AM Mexico City — daily pending reminders

[functions."process-email-queue"]
  timeout = 26
  schedule = "*/15 * * * *"  # every 15 minutes — prospección email sequences

[functions."brand-notify"]
  timeout = 20
  schedule = "*/10 * * * *"  # every 10 minutes — avisos a marcas (script/contenido/spark/stats)

# Sitio público — cuando bemeagency.com apunte a Netlify, la raíz sirve la web
# de marketing (web.html). La app interna sigue en bemeagency.netlify.app.
[[redirects]]
  from = "https://bemeagency.com/"
  to = "/web.html"
  status = 200
  force = true

[[redirects]]
  from = "https://www.bemeagency.com/"
  to = "/web.html"
  status = 200
  force = true

# Cache strategy
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
