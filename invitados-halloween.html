<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#1c1119">
<title>Lista de invitados · Fiesta de Halloween · BEME</title>
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --bg:#1c1119; --surface:#271722; --surface-2:#311d2a;
    --ink:#f6ebf1; --muted:#bfa3b3; --accent:#f05fa4; --accent-soft:#3b1830;
    --pumpkin:#ff8a3d; --ok:#5fd39a; --ok-soft:#173528;
    --border:#3d2735; --on-accent:#2b0a1c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .page{max-width:720px;margin:0 auto;padding:28px 18px 120px}
  .brandline{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:18px}
  .wordmark{font-weight:800;letter-spacing:.32em;font-size:.75rem}
  .brandline span{font-size:.75rem;color:var(--muted)}
  .eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--pumpkin)}
  h1{margin:4px 0 18px;font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.1;font-weight:800;letter-spacing:-.02em}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px}
  .stat b{display:block;font-size:1.6rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
  .stat small{color:var(--muted);font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
  .stat.ok b{color:var(--ok)}
  .bar{height:6px;background:var(--surface-2);border-radius:6px;overflow:hidden;margin-bottom:18px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pumpkin),var(--accent));transition:width .3s}

  .sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 12px;margin:0 -2px}
  .search{position:relative}
  .search input{width:100%;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:14px 44px 14px 16px;outline:none}
  .search input:focus{border-color:var(--accent)}
  .search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:1.3rem;width:38px;height:38px;cursor:pointer;display:none}
  .search.has button{display:block}
  .filters{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .chip{font:inherit;font-size:.85rem;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:7px 14px;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

  ul{list-style:none;margin:0;padding:0}
  .letter{font-size:.72rem;font-weight:800;letter-spacing:.14em;color:var(--pumpkin);padding:14px 4px 6px}
  .guest{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:6px;cursor:pointer;transition:background .15s,border-color .15s}
  .guest:active{transform:scale(.995)}
  .check{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--border);display:grid;place-items:center;font-size:.9rem;font-weight:800;color:transparent}
  .name{flex:1;min-width:0;font-weight:600}
  .name small{display:block;color:var(--muted);font-weight:500;font-size:.78rem}
  .num{color:var(--muted);font-size:.75rem;font-variant-numeric:tabular-nums}
  .guest.in{background:var(--ok-soft);border-color:#2b5b43}
  .guest.in .check{background:var(--ok);border-color:var(--ok);color:#0b2017}
  .guest.in .name{color:#cdeedd}
  mark{background:transparent;color:var(--accent);font-weight:800}
  .empty{text-align:center;color:var(--muted);padding:32px 12px}
  .empty button{margin-top:12px}

  .btn{font:inherit;font-weight:700;font-size:.9rem;border-radius:12px;padding:11px 16px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--ink)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:28px;padding-top:18px;border-top:1px solid var(--border)}
  .note{color:var(--muted);font-size:.8rem;margin-top:12px}

  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);font-weight:700;font-size:.9rem;padding:11px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;transition:.2s;pointer-events:none;max-width:calc(100% - 32px)}
  .toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .toast button{font:inherit;font-weight:800;color:var(--accent);background:none;border:0;cursor:pointer;padding:0}
  @media print{
    .sticky,.tools,.toast,.bar{display:none}
    body{background:#fff;color:#000}
    .guest{background:#fff;border-color:#ccc;color:#000;padding:4px 8px}
    .guest.in .name{color:#000}
  }
</style>
</head>
<body>
<div class="page">
  <div class="brandline"><span class="wordmark">BEME AGENCY</span><span>31 oct 2026</span></div>
  <div class="eyebrow">Fiesta de Halloween</div>
  <h1>Lista de invitados</h1>

  <div class="stats">
    <div class="stat"><b id="sTotal">0</b><small>Registrados</small></div>
    <div class="stat ok"><b id="sIn">0</b><small>Llegaron</small></div>
    <div class="stat"><b id="sOut">0</b><small>Faltan</small></div>
  </div>
  <div class="bar"><i id="bar"></i></div>

  <div class="sticky">
    <div class="search" id="searchWrap">
      <input id="q" type="search" placeholder="Buscar nombre…" autocomplete="off" autocapitalize="words" spellcheck="false" aria-label="Buscar invitado">
      <button type="button" id="clear" aria-label="Borrar búsqueda">×</button>
    </div>
    <div class="filters" role="group" aria-label="Filtrar">
      <button class="chip" data-f="all" aria-pressed="true">Todos</button>
      <button class="chip" data-f="out" aria-pressed="false">Faltan</button>
      <button class="chip" data-f="in" aria-pressed="false">Llegaron</button>
    </div>
  </div>

  <ul id="list"></ul>

  <div class="tools">
    <button class="btn primary" id="add">+ Agregar invitado</button>
    <button class="btn" id="csv">Descargar CSV</button>
    <button class="btn" onclick="window.print()">Imprimir</button>
    <button class="btn" id="reset">Reiniciar check-in</button>
  </div>
  <p class="note">Tocá un nombre para marcar que llegó (y otra vez para desmarcar). El check-in se guarda en este dispositivo.</p>
</div>
<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="undo">Deshacer</button></div>

<script>
const BASE = ["Aaron Mercury", "Abelardo Bobadilla", "Abelardo Reinery Bobadilla Mejia", "Adalberto Maytorena", "Adrián L Santos", "Adriana Duarte Álvarez", "Agustin Gabriel Rios", "Alan Beltrán", "Alan Tamayo Gomez Llanos", "Alba Fernanda Beltran Clouthier", "Alejandra Castro Inzunza", "Alejandra Ordorica", "Alejandro Ayala", "Alejandro Jimenez Sanchez", "Alejandro Tenorio", "Alejandro Zamarripa Galván", "Alejo Cerdera", "Alessa Collado Ruiz", "Alex Zavala Noyola", "Alexa Becerra", "Alexa Garcia", "Alexis Franco Pérez", "Alfredo Cacho", "Alina Rose", "Aline Madera", "Álvaro Woo", "Amanda Muñoz", "Amaranta Venegas", "Amilkar Galaviz", "Ana Fernanda Lemus", "Ana Sofía Ovalles Lobato", "Angela Avalos", "Angelica Soto Enriquez", "Annete Ceballos", "Antonella Paoletti", "Antonio Monterde Priego", "Are Velz", "Armando Corona Monsalvo", "Astrid Carolina Aragón Romo", "Aylin Antunez Bravo", "Bautista Andrés Fidalgo", "Bella Mijangos", "Blanca Díaz Alfaro", "Brandon Yurem Camarena Solorio", "Brayan Rodrigo González Cavazos", "Brenda Yamilet Almaraz Cruz", "Brianda Deyanara Moreno Guerrero", "Brisa Edhit Porras Corona", "Bryan Alejandro Nieto Steevens", "Caeli Santa Olalla", "Camila Contreras", "Carolina Díaz", "Casandra Avila Cruz", "Cecilia Tenorio", "Celeste Pellegrini Pacheco", "Charlie Lopez", "Chilin y Pikin", "Chris Arroyo", "Christian Johan Lagunas Arreola", "Citlaly Figueroa Lara", "Coral Díaz Mera", "Dafne Zuñiga Torres", "Dana Ruiz", "Dani Sanchez", "Dani Torres", "Daniel Alexis Lopez Noriega", "Daniel Eduardo Castellanos Torres", "Daniela Alexandra Burgos Bustos", "Daniela Nieto", "Danyancat", "Daria Lenets", "Darwin Bladimir Salazar Cedeño", "Dasha de la Torre", "David Camacho Ayala", "David Tobias Rodriguez", "Deiby Ruiz", "Denisse Carrera", "Diveana Hilewsky", "Douglas Castillo Chavarria", "Dulce Anahi Rios Cardenas", "Dulce Verónica Rojo López", "Dylan Zivan Ortiz Ortega", "Eddy SKabeche", "Eduardo Ignacio Cachavilano", "Effy Padilla", "Emilio Romero Rodriguez", "Enrique de Jesús González", "Erick Lindoro", "Erik Oswaldo Falcón Alcalá", "Esteban Castillo Chavarría", "Estefani Lebrero", "Eugenio Odriozola", "Eva María Félix", "Evelyn Rodiles", "Fatima Milagros Rangel", "Federica Garcia Gonzalez", "Fernanda Castro", "Fernanda Fregoso Olvera", "Fernando Urquidez", "Ferxiita", "Florencia Lucrecia Beristain Flores", "Francisco Ramirez", "Frida Montserrat Garza Hernandez", "Frida Ortega", "Frida Ruiz Herrera", "Gared Estrada", "George Karo", "Gialover", "Giovanna Paz", "Giuliana Paoletti", "Guadalupe Michel Chávez Verdín", "Gustavo Rincon", "Hana Zuleima Medina Cantu", "Hanna Suárez", "Hasly Medina", "Hector Ignacio Garza Torres", "Heidi Ayala", "Heilly Yanez", "Ian Vázquez", "Ibrahim Ayub", "Ilya Hunter", "Irazu Torres", "Isa Delgado", "Isabella Faro", "Isabella Macouzet", "Isabella Oseguera", "Israel Cervantes", "Israel Vega", "Itzel Márquez Ardizoni", "Ivan Fernando Puebla González", "Jackeline Fuentes", "Jailyne Ojeda", "Jaime Maqueo Llantada", "Jana Ramírez Ochoa", "Janeth Alexia Sánchez Monge", "Jareth Gerardo Cuellar Felix", "Javier Rojo", "Jean Emiliano González", "Jennifer López Jauregui", "Jennifer Michel Hernández Ramírez", "Joaquín León", "Jonathan Maximiliano Lozano Rangel", "José Antonio Soto Enríquez", "Jose Juan Felix Torres", "José Leonardo Broianigo Muñoz", "José Luis Apodaca Rodelo", "Juan Andrés González Pérez", "Juan Carlos Cacho", "Juan Diego Arestegui Camarena", "Juan José Cisneros Peña", "Juan Pablo Eguiarte", "Julian Duque Martinez", "Karen Densmore", "Karen Saldaña", "Karen Torres", "Karime Ailin Cardenas González", "Karla Hernández", "Kassandra Guadalupe Álvarez Domínguez", "Katherine Suzette Bernal Torres", "Kimberly Clemente", "Koco Vega", "Kurt Cantello", "Laura Páez", "Leo Monroy", "Leobardo Quintana Aguilar", "Leonardo Héctor de la O Crovi", "Leslie García Lopez", "Lia Mendi", "Libardo Isaza y Amaranta Venegas", "Lilian Sánchez", "Lina Arroyave", "Litzy Nayomi Subías Espinoza", "Liubov Gracheva", "Ludmila Weler", "Luis Enrique Amador Alanís", "Luis Fernando Pacheco Rodríguez", "Luis Gutierrez", "Luis Suárez", "Luisa Jourdan", "Lya Romina Maciel", "Mairy Garcia", "Majo Blasquez", "Mar Angeles", "Marco Junior Rejas Mavity", "Marcos Rincon", "María de la Luz Estudiante Contla", "María Fernanda Caudillo Villalvazo", "María Isabel Figueroa Garcia", "María Katrishka Sashida Chacón", "Mariana Areli Ayala Ochoa", "Mariana Cantu", "Mariana Paulina De León Lira", "Mariana Virgen", "Marina Granados", "Mario Riveretti", "Marla Magol", "Mauricio Garza Flores", "Mauricio Mc Mahon Molina", "Max Mills", "May Osorio", "Megan Sofia Alvarez", "Melany Valeria Montemayor", "Melissa Campos", "Mercedes Roa", "Miel Alarcon", "Miguel Angel Ospina", "Millos", "Miranda Sevilla", "Mishelle Rodriguez", "Mónica Michel Sanchez Gonzalez", "Montse Lejarazu", "Nailea Nahomi Arellano Pitalua", "Nancy More", "Naomi Quetzalli Gonzalez Marin", "Néstor Peña Ferniza", "Neyvi Delgado", "Nicole Gomez", "Nixandra Paola Rojas Lopez", "Óscar Omar Chávez Verdín", "Pablo Antonio Medina Tirado", "Pamela Correa", "Paola Acuña Ahumada", "Paola Ravia", "Paul Cruz Palacios", "Paulina Hernández Rojas", "Paulina Izquierdo Rivero", "Pedro Figueira", "Pepe Unzueta", "Perseo Sainz", "Rafa Alonso, Al", "Rafael González De Jesús", "Ramón Emilio Hernández", "Regina Villaverde Cruz", "Richard Arroyo", "Rocio Sanchez del Rio", "Rodrigo Munguía Sanchez", "Rodrigo Wainberg", "Ryan Hoffman Javier Flores", "Sadya Mariana Martinez Fuerte", "Sara Muñoz", "Sharon Osorio", "Sherlyn Sánchez", "Siboney Contreras", "Simón Buriticá Jaramillo", "Simón Simón Ahued", "Sofía Tenorio", "Sonia Núñez Rios", "Stephanie Serrano Velazquez", "Tamara D’Amore", "Tatiana Pereiras", "Taylor David Angulo", "Thalia de Anda", "Tonatiuh Mejia Saldaña", "Valentina Borrelli", "Valentina Parra", "Valeria Hernández Cabrera", "Vanessa Guadalupe Rodríguez Díaz", "Vianey Darely Félix Meza", "Victor Ramirez", "Victoria Belmont", "Violeta Mendoza", "Vivian Paulette Félix Meza", "Wendy Gandara", "Xime Rico", "Ximena Gómez", "Ximena López Robledo", "Ximena Nazor", "Xio Garcia", "Yael Romero", "Yesica Coscia", "Yesica Leusink", "Yolo (Flavio Broianigo)", "Yoosthin Dornan Rosales", "Yoselin Hernandez", "Yurgenis Aular"];
const KEY_IN = 'beme_halloween26_in';
const KEY_EXTRA = 'beme_halloween26_extra';

const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
let checked = new Map(Object.entries(load(KEY_IN, {})));   // name -> hora de llegada
let extra = load(KEY_EXTRA, []);
let filter = 'all';
let lastAction = null;

const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save = () => {
  localStorage.setItem(KEY_IN, JSON.stringify(Object.fromEntries(checked)));
  localStorage.setItem(KEY_EXTRA, JSON.stringify(extra));
};
const all = () => [...BASE.map((n, i) => ({ n, num: i + 1 })), ...extra.map(n => ({ n, num: null }))]
  .sort((a, b) => norm(a.n).localeCompare(norm(b.n)));

function highlight(name, q) {
  if (!q) return esc(name);
  const nn = norm(name);
  // norm() conserva la longitud de las letras base, así que los índices coinciden con el original
  const base = name.normalize('NFD').replace(/[̀-ͯ]/g, '');
  if (base.length !== name.length) return esc(name);
  let out = '', i = 0, idx;
  while ((idx = nn.indexOf(q, i)) !== -1) {
    out += esc(name.slice(i, idx)) + '<mark>' + esc(name.slice(idx, idx + q.length)) + '</mark>';
    i = idx + q.length;
  }
  return out + esc(name.slice(i));
}

function render() {
  const q = norm(document.getElementById('q').value.trim());
  document.getElementById('searchWrap').classList.toggle('has', !!q);
  const terms = q.split(/\s+/).filter(Boolean);
  const guests = all();
  const rows = guests.filter(g => {
    const isIn = checked.has(g.n);
    if (filter === 'in' && !isIn) return false;
    if (filter === 'out' && isIn) return false;
    const nn = norm(g.n);
    return terms.every(t => nn.includes(t));
  });

  const total = guests.length, inside = guests.filter(g => checked.has(g.n)).length;
  sTotal.textContent = total; sIn.textContent = inside; sOut.textContent = total - inside;
  bar.style.width = (total ? inside / total * 100 : 0) + '%';

  if (!rows.length) {
    list.innerHTML = `<li class="empty">No hay nadie con ese nombre${q ? '' : ' en este filtro'}.` +
      (q ? `<br><button class="btn primary" id="addFromSearch">+ Agregar “${esc(document.getElementById('q').value.trim())}”</button>` : '') + '</li>';
    document.getElementById('addFromSearch')?.addEventListener('click', () => addGuest(document.getElementById('q').value.trim()));
    return;
  }
  let html = '', letter = '';
  const hl = terms.length === 1 ? terms[0] : '';
  for (const g of rows) {
    const L = norm(g.n)[0].toUpperCase();
    if (!q && L !== letter) { letter = L; html += `<li class="letter">${esc(L)}</li>`; }
    const t = checked.get(g.n);
    html += `<li><button class="guest${t ? ' in' : ''}" data-n="${esc(g.n)}">
      <span class="check">✓</span>
      <span class="name">${highlight(g.n, hl)}${t ? `<small>Llegó ${esc(t)}</small>` : (g.num ? '' : '<small>Agregado en puerta</small>')}</span>
      <span class="num">${g.num ? '#' + g.num : '+'}</span></button></li>`;
  }
  list.innerHTML = html;
}

function toast(msg, undo) {
  lastAction = undo;
  toastMsg.textContent = msg;
  document.getElementById('undo').style.display = undo ? '' : 'none';
  toastEl.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => toastEl.classList.remove('show'), 3500);
}
const toastEl = document.getElementById('toast');

list.addEventListener('click', e => {
  const b = e.target.closest('.guest'); if (!b) return;
  const n = b.dataset.n;
  if (checked.has(n)) {
    const prev = checked.get(n);
    checked.delete(n);
    toast(`${n} desmarcado`, () => checked.set(n, prev));
  } else {
    checked.set(n, new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }));
    toast(`✓ ${n} llegó`, () => checked.delete(n));
    const qi = document.getElementById('q');
    if (qi.value) { qi.value = ''; }
  }
  save(); render();
});

document.getElementById('undo').addEventListener('click', () => {
  if (lastAction) { lastAction(); lastAction = null; save(); render(); }
  toastEl.classList.remove('show');
});

document.getElementById('q').addEventListener('input', render);
document.getElementById('clear').addEventListener('click', () => { const qi = document.getElementById('q'); qi.value = ''; qi.focus(); render(); });
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  filter = c.dataset.f;
  document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === c));
  render();
}));

function addGuest(pref) {
  const n = (prompt('Nombre del invitado', pref || '') || '').trim().replace(/\s+/g, ' ');
  if (!n) return;
  if (all().some(g => norm(g.n) === norm(n))) { toast(`${n} ya está en la lista`); return; }
  extra.push(n);
  checked.set(n, new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }));
  document.getElementById('q').value = '';
  save(); render();
  toast(`✓ ${n} agregado y marcado`, () => { extra = extra.filter(x => x !== n); checked.delete(n); });
}
document.getElementById('add').addEventListener('click', () => addGuest(''));

document.getElementById('csv').addEventListener('click', () => {
  const rows = [['#', 'Nombre', 'Llegó', 'Hora', 'Origen']];
  all().forEach(g => rows.push([g.num ?? '', g.n, checked.has(g.n) ? 'Sí' : 'No', checked.get(g.n) || '', g.num ? 'Registro' : 'Agregado en puerta']));
  const csv = '﻿' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'invitados-halloween.csv';
  a.click();
});

document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('¿Borrar todos los check-ins y los invitados agregados en puerta?')) return;
  checked = new Map(); extra = []; save(); render();
});

render();
</script>
</body>
</html>
