<style>
  :root{
    --bg:#1c1119; --surface:#271722; --surface-2:#311d2a;
    --ink:#f6ebf1; --muted:#bfa3b3; --accent:#f05fa4; --accent-soft:#3b1830;
    --pumpkin:#ff8a3d; --ok:#5fd39a; --ok-soft:#173528;
    --border:#3d2735; --on-accent:#2b0a1c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink)}
  body{font-family:'Plus Jakarta Sans',-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
  .page{max-width:720px;margin:0 auto;padding:28px 18px 120px}
  .brandline{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:18px}
  .wordmark{font-weight:800;letter-spacing:.32em;font-size:.75rem}
  .brandline span{font-size:.75rem;color:var(--muted)}
  .eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--pumpkin)}
  h1{margin:4px 0 18px;font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.1;font-weight:800;letter-spacing:-.02em}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 14px}
  .stat b{display:block;font-size:1.6rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
  .stat small{color:var(--muted);font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
  .stat.ok b{color:var(--ok)}
  .bar{height:6px;background:var(--surface-2);border-radius:6px;overflow:hidden;margin-bottom:18px}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pumpkin),var(--accent));transition:width .3s}

  .sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 12px;margin:0 -2px}
  .search{position:relative}
  .search input{width:100%;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:14px 44px 14px 16px;outline:none}
  .search input:focus{border-color:var(--accent)}
  .search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:1.3rem;width:38px;height:38px;cursor:pointer;display:none}
  .search.has button{display:block}
  .filters{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .chip{font:inherit;font-size:.85rem;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:7px 14px;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

  ul{list-style:none;margin:0;padding:0}
  .letter{font-size:.72rem;font-weight:800;letter-spacing:.14em;color:var(--pumpkin);padding:14px 4px 6px}
  .guest{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:6px;cursor:pointer;transition:background .15s,border-color .15s}
  .guest:active{transform:scale(.995)}
  .check{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--border);display:grid;place-items:center;font-size:.9rem;font-weight:800;color:transparent}
  .name{flex:1;min-width:0;font-weight:600}
  .name small{display:block;color:var(--muted);font-weight:500;font-size:.78rem}
  .num{color:var(--muted);font-size:.75rem;font-variant-numeric:tabular-nums}
  .guest.in{background:var(--ok-soft);border-color:#2b5b43}
  .guest.in .check{background:var(--ok);border-color:var(--ok);color:#0b2017}
  .guest.in .name{color:#cdeedd}
  mark{background:transparent;color:var(--accent);font-weight:800}
  .empty{text-align:center;color:var(--muted);padding:32px 12px}
  .empty button{margin-top:12px}

  .btn{font:inherit;font-weight:700;font-size:.9rem;border-radius:12px;padding:11px 16px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--ink)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:28px;padding-top:18px;border-top:1px solid var(--border)}
  .note{color:var(--muted);font-size:.8rem;margin-top:12px}

  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);font-weight:700;font-size:.9rem;padding:11px 16px;border-radius:12px;display:flex;gap:14px;align-items:center;transition:.2s;pointer-events:none;max-width:calc(100% - 32px)}
  .toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
  .toast button{font:inherit;font-weight:800;color:var(--accent);background:none;border:0;cursor:pointer;padding:0}
  @media print{
    .sticky,.tools,.toast,.bar{display:none}
    body{background:#fff;color:#000}
    .guest{background:#fff;border-color:#ccc;color:#000;padding:4px 8px}
    .guest.in .name{color:#000}
  }
</style>

  if (!q) return esc(name);
  const nn = norm(name);
  // norm() conserva la longitud de las letras base, así que los índices coinciden con el original
  const base = name.normalize('NFD').replace(/[̀-ͯ]/g, '');
  if (base.length !== name.length) return esc(name);
  let out = '', i = 0, idx;
  while ((idx = nn.indexOf(q, i)) !== -1) {
    out += esc(name.slice(i, idx)) + '<mark>' + esc(name.slice(idx, idx + q.length)) + '</mark>';
    i = idx + q.length;
  }
  return out + esc(name.slice(i));
}

function render() {
  const q = norm(document.getElementById('q').value.trim());
  document.getElementById('searchWrap').classList.toggle('has', !!q);
  const terms = q.split(/\s+/).filter(Boolean);
  const guests = all();
  const rows = guests.filter(g => {
    const isIn = checked.has(g.n);
    if (filter === 'in' && !isIn) return false;
    if (filter === 'out' && isIn) return false;
    const nn = norm(g.n);
    return terms.every(t => nn.includes(t));
  });

  const total = guests.length, inside = guests.filter(g => checked.has(g.n)).length;
  sTotal.textContent = total; sIn.textContent = inside; sOut.textContent = total - inside;
  bar.style.width = (total ? inside / total * 100 : 0) + '%';

  if (!rows.length) {
    list.innerHTML = `<li class="empty">No hay nadie con ese nombre${q ? '' : ' en este filtro'}.` +
      (q ? `<br><button class="btn primary" id="addFromSearch">+ Agregar “${esc(document.getElementById('q').value.trim())}”</button>` : '') + '</li>';
    document.getElementById('addFromSearch')?.addEventListener('click', () => addGuest(document.getElementById('q').value.trim()));
    return;
  }
  let html = '', letter = '';
  const hl = terms.length === 1 ? terms[0] : '';
  for (const g of rows) {
    const L = norm(g.n)[0].toUpperCase();
    if (!q && L !== letter) { letter = L; html += `<li class="letter">${esc(L)}</li>`; }
    const t = checked.get(g.n);
    html += `<li><button class="guest${t ? ' in' : ''}" data-n="${esc(g.n)}">
      <span class="check">✓</span>
      <span class="name">${highlight(g.n, hl)}${t ? `<small>Llegó ${esc(t)}</small>` : (g.num ? '' : '<small>Agregado en puerta</small>')}</span>
      <span class="num">${g.num ? '#' + g.num : '+'}</span></button></li>`;
  }
  list.innerHTML = html;
}

function toast(msg, undo) {
  lastAction = undo;
  toastMsg.textContent = msg;
  document.getElementById('undo').style.display = undo ? '' : 'none';
  toastEl.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => toastEl.classList.remove('show'), 3500);
}
const toastEl = document.getElementById('toast');

list.addEventListener('click', e => {
  const b = e.target.closest('.guest'); if (!b) return;
  const n = b.dataset.n;
  if (checked.has(n)) {
    const prev = checked.get(n);
    checked.delete(n);
    toast(`${n} desmarcado`, () => checked.set(n, prev));
  } else {
    checked.set(n, new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }));
    toast(`✓ ${n} llegó`, () => checked.delete(n));
    const qi = document.getElementById('q');
    if (qi.value) { qi.value = ''; }
  }
  save(); render();
});

document.getElementById('undo').addEventListener('click', () => {
  if (lastAction) { lastAction(); lastAction = null; save(); render(); }
  toastEl.classList.remove('show');
});

document.getElementById('q').addEventListener('input', render);
document.getElementById('clear').addEventListener('click', () => { const qi = document.getElementById('q'); qi.value = ''; qi.focus(); render(); });
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  filter = c.dataset.f;
  document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === c));
  render();
}));

function addGuest(pref) {
  const n = (prompt('Nombre del invitado', pref || '') || '').trim().replace(/\s+/g, ' ');
  if (!n) return;
  if (all().some(g => norm(g.n) === norm(n))) { toast(`${n} ya está en la lista`); return; }
  extra.push(n);
  checked.set(n, new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }));
  document.getElementById('q').value = '';
  save(); render();
  toast(`✓ ${n} agregado y marcado`, () => { extra = extra.filter(x => x !== n); checked.delete(n); });
}
document.getElementById('add').addEventListener('click', () => addGuest(''));

document.getElementById('csv').addEventListener('click', () => {
  const rows = [['#', 'Nombre', 'Llegó', 'Hora', 'Origen']];
  all().forEach(g => rows.push([g.num ?? '', g.n, checked.has(g.n) ? 'Sí' : 'No', checked.get(g.n) || '', g.num ? 'Registro' : 'Agregado en puerta']));
  const csv = '﻿' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'invitados-halloween.csv';
  a.click();
});

document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('¿Borrar todos los check-ins y los invitados agregados en puerta?')) return;
  checked = new Map(); extra = []; save(); render();
});

render();
</script>
</body>
